version: 1
agents:
  - id: claude
    scopes: [user, project]
  - id: cursor
    scopes: [user, project]
  - id: codex
    scopes: [user, project]
skills:
  - slug: handoff
    installations:
      - { agent: claude, scope: user }
      - { agent: codex, scope: user }
  - slug: enforcement-code
    installations:
      - { agent: claude, scope: user }
      - { agent: cursor, scope: user }
      - { agent: codex, scope: user }
  - slug: merge-verdict
    installations:
      - { agent: claude, scope: user }
      - { agent: cursor, scope: user }
      - { agent: codex, scope: user }
external:
  roots:
    - agent: codex
      scope: user
      origin: system
      location: { root: home, path: .codex/skills/.system }
  plugins:
    - agent: claude
      scope: user
      id: superpowers@claude-plugins-official
  skills:
