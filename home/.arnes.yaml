  - id: format-edited-file
    installations:
      - { agent: claude, scope: user }
      - { agent: codex, scope: user }
external:
  roots:
    - agent: codex
      scope: user
      origin: system
      location: { root: home, path: .codex/skills/.system }
  plugins:
    - { agent: claude, scope: user, id: codex@openai-codex }
    - {
        agent: claude,
        scope: user,
        id: agent-reach@agent-reach-adapter,
        required: true,
      }
    - {
        agent: codex,
        scope: user,
        id: agent-reach@agent-reach-adapter,
        required: true,
      }
    - { agent: cursor, scope: user, id: agent-reach, required: true }
    - { agent: codex, scope: user, id: chrome@openai-bundled }
    - { agent: codex, scope: user, id: code-review@openai-bundled }
    - { agent: codex, scope: user, id: codex-app-tools@openai-bundled }
    - { agent: codex, scope: user, id: computer-use@openai-bundled }
    - { agent: codex, scope: user, id: github@openai-curated }
    - { agent: codex, scope: user, id: tracing@langsmith-codex-plugins }
    - { agent: codex, scope: user, id: sites@openai-bundled }
    - { agent: codex, scope: user, id: unified-computer-use@openai-bundled }
  skills:
    - { agent: claude, scope: user, origin: managed, slug: handoff }
    - { agent: codex, scope: user, origin: managed, slug: handoff }
    - {
        agent: claude,
        scope: user,
        origin: managed,
        slug: proof-integrity-review,
      }
    - {
        agent: cursor,
        scope: user,
        origin: managed,
        slug: proof-integrity-review,
      }
    - {
        agent: codex,
        scope: user,
        origin: managed,
        slug: proof-integrity-review,
      }
    - {
        agent: claude,
        scope: user,
        origin: plugin,
        plugin: codex@openai-codex,
        slug: codex-cli-runtime,
      }
    - {
        agent: claude,
        scope: user,
        origin: plugin,
        plugin: codex@openai-codex,
        slug: codex-result-handling,
      }
    - {
        agent: claude,
        scope: user,
        origin: plugin,
        plugin: codex@openai-codex,
        slug: gpt-5-4-prompting,
      }
    - {
        agent: claude,
        scope: user,
        origin: plugin,
        plugin: agent-reach@agent-reach-adapter,
        slug: agent-reach,
      }
    - {
        agent: codex,
        scope: user,
        origin: plugin,
        plugin: agent-reach@agent-reach-adapter,
        slug: agent-reach,
      }
    - agent: codex
      scope: user
      origin: system
      slug: openai-docs
    - {
        agent: cursor,
        scope: user,
        origin: plugin,
        plugin: agent-reach,
        slug: agent-reach,
      }
    - {
        agent: codex,
        scope: user,
        origin: plugin,
        plugin: sites@openai-bundled,
        slug: sites-building,
      }
    - {
        agent: codex,
        scope: user,
        origin: plugin,
        plugin: sites@openai-bundled,
        slug: sites-hosting,
      }
statuslines:
  - agent: codex
    scope: user
    items:
      - model-with-reasoning
      - git-branch
      - current-dir
      - context-used
      - context-window-size
mcp:
  - name: context7
    agent: codex
    scope: user
    url: https://mcp.context7.com/mcp
  - name: apple-notes
    agent: claude
    scope: project
    command: /Applications/Apple Notes Exporter.app/Contents/SharedSupport/notes-export-mcp
    enabled: true
resources:
  - id: claude-user-instructions
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .claude/CLAUDE.md }
  - id: claude-user-soul
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/SOUL.md }
    destination: { root: home, path: .claude/SOUL.md }
  - id: claude-user-preferences
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/USER.md }
    destination: { root: home, path: .claude/USER.md }
  - id: claude-user-visual-presentation
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/visual-presentation.md }
    destination: { root: home, path: .claude/visual-presentation.md }
  - id: claude-user-agent-instructions
    kind: rules
    agent: claude
    scope: user
    source:
      {
        root: repository,
        path: node_modules/@sebastienelet/agent-skills/skills/agent-instructions/references/maintenance.md,
      }
    destination: { root: home, path: .claude/rules/agent-instructions.md }
  - id: cursor-user-visual-presentation
    kind: rules
    agent: cursor
    scope: user
    source: { root: repository, path: harness/visual-presentation.md }
    destination: { root: home, path: .cursor/rules/visual-presentation.mdc }
  - id: claude-project-instructions
    kind: instructions
    agent: claude
    scope: project
    source: { root: repository, path: AGENTS.md }
    destination: { root: repository, path: CLAUDE.md }
  - id: codex-user-instructions
    kind: instructions
    agent: codex
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .codex/AGENTS.md }
  - id: claude-user-skills
    kind: skills
    agent: claude
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .claude/skills }
  - id: cursor-user-skills
    kind: skills
    agent: cursor
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .cursor/skills }
  - id: codex-user-skills
    kind: skills
    agent: codex
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .agents/skills }
  - id: claude-project-skills
    kind: skills
    agent: claude
    scope: project
    layout: root
    source: { root: repository, path: .agents/skills }
    destination: { root: repository, path: .claude/skills }
  - id: cursor-project-skills
    kind: skills
    agent: cursor
    scope: project
    layout: root
    source: { root: repository, path: .agents/skills }
    destination: { root: repository, path: .cursor/skills }
  - id: codex-project-skills
    kind: skills
    agent: codex
    scope: project
    layout: root
    source: { root: repository, path: .agents/skills }
    destination: { root: repository, path: .codex/skills }
