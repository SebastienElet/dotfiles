statuslines:
  - agent: codex
    scope: user
    items:
      - model-with-reasoning
      - git-branch
      - current-dir
      - context-used
      - context-window-size
mcp:
  - name: apple-notes
    agent: claude
    scope: project
    command: /Applications/Apple Notes Exporter.app/Contents/SharedSupport/notes-export-mcp
    enabled: true
resources:
  - id: claude-user-instructions
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .claude/CLAUDE.md }
  - id: claude-user-soul
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/SOUL.md }
    destination: { root: home, path: .claude/SOUL.md }
  - id: claude-user-preferences
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/USER.md }
    destination: { root: home, path: .claude/USER.md }
  - id: claude-user-visual-presentation
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/visual-presentation.md }
    destination: { root: home, path: .claude/visual-presentation.md }
  - id: claude-user-agent-instructions
    kind: rules
    agent: claude
    scope: user
    source:
      {
        root: repository,
        path: harness/skills/agent-instructions/references/maintenance.md,
      }
    destination: { root: home, path: .claude/rules/agent-instructions.md }
  - id: cursor-user-memory-governance
    kind: rules
    agent: cursor
    scope: user
    source:
      { root: repository, path: harness/rules/memory-governance-cursor.mdc }
    destination:
      { root: home, path: .cursor/rules/memory-governance-cursor.mdc }
  - id: cursor-user-visual-presentation
    kind: rules
    agent: cursor
    scope: user
    source: { root: repository, path: harness/visual-presentation.md }
    destination: { root: home, path: .cursor/rules/visual-presentation.mdc }
  - id: claude-project-instructions
    kind: instructions
    agent: claude
    scope: project
    source: { root: repository, path: AGENTS.md }
    destination: { root: repository, path: CLAUDE.md }
  - id: codex-user-instructions
    kind: instructions
    agent: codex
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .codex/AGENTS.md }
  - id: claude-user-skills
    kind: skills
    agent: claude
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .claude/skills }
  - id: cursor-user-skills
    kind: skills
    agent: cursor
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .cursor/skills }
  - id: codex-user-skills
    kind: skills
    agent: codex
    scope: user
    layout: leaves
    source: { root: repository, path: harness/skills }
    destination: { root: home, path: .agents/skills }
  - id: claude-project-skills
    kind: skills
    agent: claude
    scope: project
    layout: root
    source: { root: repository, path: .agents/skills }
    destination: { root: repository, path: .claude/skills }
  - id: cursor-project-skills
    kind: skills
    agent: cursor
    scope: project
    layout: root
    source: { root: repository, path: .agents/skills }
    destination: { root: repository, path: .cursor/skills }
