version: 1
agents:
  - id: claude
    scopes: [user, project]
    user_config:
      model: sonnet
      effort: high
      auto_compact_window: 600000
      sync_claude_ai_skills: false
  - id: cursor
    scopes: [user, project]
    user_config:
      model: grok-4.6
      max_mode: false
  - id: codex
    scopes: [user, project]
    user_config:
      model: gpt-5.6-sol
      effort: high
      context_window: 512000
skills:
