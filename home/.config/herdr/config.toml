onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui]
tab_bar_right = [{ type = "command", command = "/Users/sebastien/.config/herdr/plugins/github/herdr-projects-b1278ffb803c/target/release/herdr-projects --root /Users/sebastien/.herdr-projects needs-you --line", interval_seconds = 15, timeout_seconds = 5 }]

[ui.sound]
enabled = false

[ui.sidebar.agents]
rows = [["state_icon", { token = "agent", bold = false, dim = false, rules = [{ contains = "​", bold = true }] }, "state_text"], [{ token = "$hp_sub", dim = true }]]

[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", rules = [{ contains = "⠀", bold = true }] }, { token = "branch", dim = true }, "git_status"]]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "Projects"
