tasks:
  agent-reach:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/agent-reach.ts" configuration "$workspaceRoot" "$HOME"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/agent-reach/compose.yaml" "$HOME/.config/agent-reach/compose.yaml"
    deps: [repository:dependencies]
    toolchains: bun
    options: { cache: false, runInCI: false, mutex: harness-mutation }
  install:
    command: noop
    deps:
      - bat
      - fish
      - nvim
      - wezterm
      - git-delta
      - starship
      - tmux
      - hunspell-dictionaries
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
  bat:
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      theme_dir="$HOME/.config/bat/themes"
      cache_dir="$(bat --cache-dir)"
      test -n "$cache_dir"
      mkdir -p "$theme_dir"
      rm -f "$cache_dir/.catppuccin-ready"
      theme_file="$(mktemp "$theme_dir/.Catppuccin-Latte.XXXXXX")"
      trap 'rm -f "$theme_file"' EXIT
      curl -fSL -o "$theme_file" https://raw.githubusercontent.com/catppuccin/bat/6810349b28055dce54076712fc05fc68da4b8ec0/themes/Catppuccin%20Latte.tmTheme
      echo "a2ddb65bfcf7328802ee4770d1e34ef4093a20fd5c300be3138c99f8a45ed5cb  $theme_file" | shasum -a 256 -c - > /dev/null
      mv "$theme_file" "$theme_dir/Catppuccin Latte.tmTheme"
      theme_file="$(mktemp "$theme_dir/.Catppuccin-Mocha.XXXXXX")"
      curl -fSL -o "$theme_file" https://raw.githubusercontent.com/catppuccin/bat/6810349b28055dce54076712fc05fc68da4b8ec0/themes/Catppuccin%20Mocha.tmTheme
      echo "395566f08ceb301b936b91c077690ef94f7aeb651b121553f201c99c2bd4aa77  $theme_file" | shasum -a 256 -c - > /dev/null
      mv "$theme_file" "$theme_dir/Catppuccin Mocha.tmTheme"
      bat cache --build
      touch "$cache_dir/.catppuccin-ready"
    deps:
      - repository:bat-setup
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          set -eo pipefail
          theme_dir="$HOME/.config/bat/themes"
          cache_dir="$(bat --cache-dir)"
          test -n "$cache_dir"
          test -f "$cache_dir/.catppuccin-ready"
          test -s "$cache_dir/themes.bin"
          test -s "$cache_dir/syntaxes.bin"
          test -s "$cache_dir/metadata.yaml"
          echo "a2ddb65bfcf7328802ee4770d1e34ef4093a20fd5c300be3138c99f8a45ed5cb  $theme_dir/Catppuccin Latte.tmTheme" | shasum -a 256 -c - > /dev/null
          echo "395566f08ceb301b936b91c077690ef94f7aeb651b121553f201c99c2bd4aa77  $theme_dir/Catppuccin Mocha.tmTheme" | shasum -a 256 -c - > /dev/null
          bat --list-themes | grep -Fx 'Catppuccin Latte' > /dev/null
          bat --list-themes | grep -Fx 'Catppuccin Mocha' > /dev/null
    toolchains: system
    options:
      cache: false
      runInCI: false
  fish:
    command: noop
    deps:
      - starship
      - fish-plugins
    toolchains: system
    options:
      cache: false
      runInCI: false
  fish-plugins:
    deps:
      - repository:dependencies
      - repository:fish-setup
      - repository:fisher-setup
      - repository:fzf-setup
    toolchains: bun
    options:
      cache: false
      runInCI: false
    script: PATH="$PATH:/opt/homebrew/bin:/usr/local/bin" bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-fish-plugins.ts" "$projectRoot/.config/fish" "$HOME/.config/fish"
  nvim:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/nvim" "$HOME/.config/nvim"
    deps:
      - repository:dependencies
      - cspell-config
    toolchains: bun
    options:
      cache: false
      runInCI: false
  wezterm:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/wezterm/wezterm.lua" "$HOME/.config/wezterm/wezterm.lua"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  herdr:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/herdr/config.toml" "$HOME/.config/herdr/config.toml"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  git-delta:
    script: |
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/git/config.delta" "$HOME/.config/git/config.delta"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/git/ignore" "$HOME/.config/git/ignore"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-git-includes.ts"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  starship:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/starship.toml" "$HOME/.config/starship.toml"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  tmux:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/tmux/tmux.conf" "$HOME/.config/tmux/tmux.conf"
    deps:
      - repository:dependencies
      - tmux-plugins
    toolchains: bun
    options:
      cache: false
      runInCI: false
  tmux-plugins:
    script: |
      set -e
      while read -r name repository revision; do
        plugin_dir="$HOME/.tmux/plugins/$name"
        if [ ! -d "$plugin_dir/.git" ]; then
          git init --quiet "$plugin_dir"
          git -C "$plugin_dir" remote add origin "https://github.com/$repository.git"
        fi
        git -C "$plugin_dir" fetch --quiet --depth 1 origin "$revision"
        git -C "$plugin_dir" checkout --quiet --detach "$revision"
      done < "$projectRoot/tmux-plugins.lock"
    checks:
      - check: condition
        script: |-
          set -e
          while read -r name _ revision; do
            test "$(git -C "$HOME/.tmux/plugins/$name" rev-parse HEAD)" = "$revision"
          done < "$projectRoot/tmux-plugins.lock"
    inputs:
      - tmux-plugins.lock
    toolchains: system
    options:
      cache: false
      runInCI: false
  cspell-config:
    script: |
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/cspell.json" "$HOME/cspell.json"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/cspell/user.txt" "$HOME/.config/cspell/user.txt"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  postgresql:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.psqlrc" "$HOME/.psqlrc"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  arnes-config:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.arnes.yaml" "$HOME/.arnes.yaml"
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  hunspell-dictionaries:
    description: Install Hunspell dictionaries
    script: |
      set -e
      "$workspaceRoot/tooling/install-hunspell-dictionary" "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.aff" "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5" "$HOME/Library/Spelling/fr.aff"
      "$workspaceRoot/tooling/install-hunspell-dictionary" "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.dic" "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c" "$HOME/Library/Spelling/fr.dic"
      "$workspaceRoot/tooling/install-hunspell-dictionary" "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.aff" "e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e" "$HOME/Library/Spelling/en_US.aff"
      "$workspaceRoot/tooling/install-hunspell-dictionary" "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.dic" "f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647" "$HOME/Library/Spelling/en_US.dic"
    deps:
      - repository:dependencies
    inputs:
      - /tooling/install-hunspell-dictionary
      - /tooling/install-hunspell-dictionary-error.ts
      - /tooling/install-hunspell-dictionary-files.ts
      - /tooling/install-hunspell-dictionary.ts
    toolchains: bun
    options:
      cache: false
      os: macos
      runInCI: false
