{
  tasks:
    {
      install:
        {
          command: noop,
          deps:
            [
              bat,
              fish,
              nvim,
              wezterm,
              git-delta,
              starship,
              tmux,
              hunspell-dictionaries,
            ],
          toolchains: system,
          options: { cache: false, os: macos, runInCI: false },
        },
      bat:
        {
          script: "set -e\nmkdir -p \"$HOME/.config/bat/themes\"\ncurl -fSL -o \"$HOME/.config/bat/themes/Catppuccin Latte.tmTheme\" https://github.com/catppuccin/bat/raw/main/themes/Catppuccin%20Latte.tmTheme\ncurl -fSL -o \"$HOME/.config/bat/themes/Catppuccin Mocha.tmTheme\" https://github.com/catppuccin/bat/raw/main/themes/Catppuccin%20Mocha.tmTheme\nbat cache --build\n",
          deps: [repository:bat-setup],
          checks:
            [
              {
                check: condition,
                script: 'test -f "$HOME/.config/bat/themes/Catppuccin Latte.tmTheme"',
              },
            ],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      fish:
        {
          command: noop,
          deps: [starship, fish-plugins],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      fish-plugins:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-fish-plugins.ts" "$projectRoot/.config/fish" "$HOME/.config/fish"',
          deps:
            [
              repository:dependencies,
              repository:fish-setup,
              repository:fisher-setup,
              repository:fzf-setup,
            ],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      nvim:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/nvim" "$HOME/.config/nvim"',
          deps: [repository:dependencies, cspell-config],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      wezterm:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/wezterm/wezterm.lua" "$HOME/.config/wezterm/wezterm.lua"',
          deps: [repository:dependencies],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      git-delta:
        {
          script: "set -e\nbun --config=/dev/null --no-env-file \"$workspaceRoot/tooling/deploy-link.ts\" \"$projectRoot/.config/git/config.delta\" \"$HOME/.config/git/config.delta\"\nbun --config=/dev/null --no-env-file \"$workspaceRoot/tooling/deploy-link.ts\" \"$projectRoot/.config/git/ignore\" \"$HOME/.config/git/ignore\"\nbun --config=/dev/null --no-env-file \"$workspaceRoot/tooling/deploy-git-includes.ts\"\n",
          deps: [repository:dependencies],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      starship:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/starship.toml" "$HOME/.config/starship.toml"',
          deps: [repository:dependencies],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      tmux:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.config/tmux/tmux.conf" "$HOME/.config/tmux/tmux.conf"',
          deps: [repository:dependencies, tmux-plugins],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      tmux-plugins:
        {
          script: "set -e\nmkdir -p \"$HOME/.tmux/plugins\"\ngit clone https://github.com/tmux-plugins/tpm \"$HOME/.tmux/plugins/tpm\"\n",
          checks:
            [
              {
                check: condition,
                script: 'test -e "$HOME/.tmux/plugins/tpm/tpm"',
              },
            ],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      cspell-config:
        {
          script: "set -e\nbun --config=/dev/null --no-env-file \"$workspaceRoot/tooling/deploy-link.ts\" \"$projectRoot/cspell.json\" \"$HOME/cspell.json\"\nbun --config=/dev/null --no-env-file \"$workspaceRoot/tooling/deploy-link.ts\" \"$projectRoot/.config/cspell/user.txt\" \"$HOME/.config/cspell/user.txt\"\n",
          deps: [repository:dependencies],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      arnes-config:
        {
          command: 'bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/.arnes.yaml" "$HOME/.arnes.yaml"',
          deps: [repository:dependencies],
          toolchains: bun,
          options: { cache: false, runInCI: false },
        },
      hunspell-dictionaries:
        {
          description: Install Hunspell dictionaries,
          script: "set -e\n\"$workspaceRoot/tooling/install-hunspell-dictionary\" \"https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.aff\" \"c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5\" \"$HOME/Library/Spelling/fr.aff\"\n\"$workspaceRoot/tooling/install-hunspell-dictionary\" \"https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.dic\" \"b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c\" \"$HOME/Library/Spelling/fr.dic\"\n\"$workspaceRoot/tooling/install-hunspell-dictionary\" \"https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.aff\" \"e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e\" \"$HOME/Library/Spelling/en_US.aff\"\n\"$workspaceRoot/tooling/install-hunspell-dictionary\" \"https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.dic\" \"f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647\" \"$HOME/Library/Spelling/en_US.dic\"\n",
          deps: [repository:dependencies],
          inputs:
            [
              /tooling/install-hunspell-dictionary,
              /tooling/install-hunspell-dictionary-error.ts,
              /tooling/install-hunspell-dictionary-files.ts,
              /tooling/install-hunspell-dictionary.ts,
            ],
          toolchains: bun,
          options: { cache: false, os: macos, runInCI: false },
        },
    },
  env: { PATH: "${PATH}:/opt/homebrew/bin:/usr/local/bin" },
}
