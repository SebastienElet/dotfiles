language: typescript
fileGroups:
  toolingSources:
    - "**/*"
  rootToolchain:
    - /package.json
    - /bun.lock
    - /tsconfig.json
    - /.prototools
    - /.github/workflows/**/*
    - /.moon/**/*
    - /moon.yml
  deploymentSources:
    - /home/**/*
    - /harness/**/*
    - /.agents/**/*
    - /Makefile
    - /.gitignore
  bunTestSupport:
    - moon.yml
    - /moon.yml
    - /package.json
    - /bun.lock
    - /tsconfig.json
    - /.prototools
    - /.moon/tasks/javascript.yml
  codeSearchRuntime:
    - colgrep-search-cli.ts
    - colgrep-search.ts
    - colgrep-search-contract.ts
    - /harness/skills/code-search/**/*
  linkDeployment:
    - deployment-links.test.ts
    - design-claim-audit.test.ts
    - deployment-moon-runner.ts
    - deployment-test-support.ts
    - deploy-link*.ts
    - assemble-agent-instructions*.ts
    - install-agent-skills*.ts
    - colgrep-search-cli.ts
    - /home/moon.yml
    - /home/.arnes.yaml
    - /home/.codex/agents/design-claim-auditor.toml
    - /home/.config/starship.toml
    - /home/.config/tmux/**/*
    - /harness/AGENTS.md
    - /harness/moon.yml
    - /harness/SOUL.md
    - /harness/USER.md
    - /harness/rules/agent-instructions.md
    - /harness/skills/*/SKILL.md
    - /.moon/tasks/harness-claude.yml
    - /.moon/tasks/harness-codex.yml
tasks:
  test:
    command: noop
    deps:
      - repository:typescript-test
      - upgrade-test
      - code-search-test
      - deployment-test
      - hunspell-test
      - agent-memory:deployment-test
      - agent-handoff:deployment-test
    toolchains: system
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - "@group(deploymentSources)"
      - /install.sh
  deployment-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 tooling/deployment-fish.test.ts tooling/deployment-links.test.ts tooling/deployment-xdg.test.ts tooling/deploy-link.test.ts tooling/assemble-agent-instructions.test.ts tooling/install-agent-skills.test.ts tooling/design-claim-audit.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(bunTestSupport)"
      - "@group(linkDeployment)"
      - deployment-fish.test.ts
      - deployment-xdg.test.ts
      - deployment-test-provider.ts
      - deploy-fish-plugins.ts
      - deploy-git-includes.ts
      - /home/.config/fish/**/*
      - /home/.config/git/**/*
      - /home/.config/wezterm/**/*
      - /.github/workflows/test-deployment.yml
  hunspell-test:
    command: bun --config=/dev/null --no-env-file test tooling/install-hunspell-dictionary.test.ts tooling/install-hunspell-dictionary-failures.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(bunTestSupport)"
      - install-hunspell-dictionary*
      - /home/moon.yml
      - /.github/workflows/test-deployment.yml
  code-search-test:
    command: bun --config=/dev/null --no-env-file test --path-ignore-patterns "tooling/colgrep-search-integration.test.ts" tooling/code-search-*.test.ts tooling/colgrep-search*.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(bunTestSupport)"
      - "@group(codeSearchRuntime)"
      - code-search-*
      - colgrep-search*.ts
      - "!colgrep-search-integration.test.ts"
      - /.github/workflows/test-code-search.yml
  code-search-integration-test:
    deps:
      - repository:dependencies
      - colgrep-search-install
    options:
      runFromWorkspaceRoot: true
      cache: false
      os: macos
    env:
      COLGREP_INTEGRATION: "1"
    script: |-
      export PATH="$PATH:$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin"
      set -e
      export COLGREP_REAL_BIN="${COLGREP_REAL_BIN:-$(command -v colgrep)}"
      export COLGREP_SEARCH_ENTRY_POINT="$HOME/.local/bin/colgrep-search"
      "$COLGREP_REAL_BIN" --version
      "$COLGREP_SEARCH_ENTRY_POINT" || test "$?" -eq 1
      bun --config=/dev/null --no-env-file test tooling/colgrep-search-integration.test.ts
    toolchains: bun
    inputs:
      - "@group(bunTestSupport)"
      - "@group(codeSearchRuntime)"
      - colgrep-search-integration.test.ts
      - deploy-link.ts
      - install-homebrew
      - /.moon/tasks/packages.yml
      - /.moon/tasks/workstation.yml
      - /.github/workflows/test-code-search.yml
  colgrep-search-install:
    command: bun tooling/deploy-link.ts "$workspaceRoot/tooling/colgrep-search-cli.ts" "$HOME/.local/bin/colgrep-search"
    deps:
      - repository:dependencies
      - repository:colgrep-setup
    toolchains: bun
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true
    inputs:
      - "@group(bunTestSupport)"
      - colgrep-search-cli.ts
      - deploy-link.ts
  upgrade-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 tooling/upgrade.test.ts tooling/upgrade-git.test.ts tooling/upgrade-node.test.ts tooling/node-version-installation.test.ts
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - upgrade
      - upgrade*.ts
      - node-version-*.ts
      - git-main-branch
      - git-main-branch-cli.ts
      - git-main-branch-core.ts
      - /package.json
      - /bun.lock
      - /.prototools
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /.github/workflows/check-shell.yml
  upgrade-neovim-test:
    command: bun --config=/dev/null --no-env-file test --timeout 30000 ./tooling/upgrade-neovim.integration.ts
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - /home/.config/nvim/upgrade.lua
      - /home/.config/nvim/lazy-lock.json
  installer-test:
    command: bun --config=/dev/null --no-env-file test tooling/install.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - install.test.ts
      - /install.sh
      - /package.json
      - /bun.lock
      - /.prototools
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /.github/workflows/check-shell.yml
  docker-smoke:
    command: bun --config=/dev/null --no-env-file test tooling/scrapling-mcp.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    env:
      SCRAPLING_DOCKER_SMOKE: "1"
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
  smoke-minimal:
    command: bun tooling/smoke-minimal.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      os: macos
      cache: false
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - "@group(deploymentSources)"
      - /Brewfile
      - /install.sh
