language: typescript
fileGroups:
  toolingSources:
    - "**/*"
  rootToolchain:
    - /package.json
    - /bun.lock
    - /tsconfig.json
    - /.prototools
    - /.github/workflows/**/*
    - /.moon/**/*
    - /moon.yml
  deploymentSources:
    - /home/**/*
    - /harness/**/*
    - /.agents/**/*
    - /.gitignore
  bunTestSupport:
    - moon.yml
    - /moon.yml
    - /package.json
    - /bun.lock
    - /tsconfig.json
    - /.prototools
    - /.moon/tasks/javascript.yml
  linkDeployment:
    - deployment-links.test.ts
    - moon/optional-links.test.ts
    - docker-install-test-provider.ts
    - install-docker-artifact
    - install-docker-artifact.ts
    - scrapling-mcp
    - design-claim-audit.test.ts
    - deployment-moon-runner.ts
    - deployment-test-support.ts
    - deployment-test-command.ts
    - deploy-link*.ts
    - /tooling/agent-memory/moon.yml
    - /tooling/agent-handoff/moon.yml
    - /tooling/arnes/moon.yml
    - deploy-scrapling-launcher*.ts
    - check-docker-cli
    - /.moon/tasks/docker.yml
    - assemble-agent-instructions*.ts
    - install-agent-skills*.ts
    - /home/moon.yml
    - /home/.psqlrc
    - /home/.arnes.yaml
    - /home/.codex/agents/design-claim-auditor.toml
    - /home/.config/starship.toml
    - /home/.config/tmux/**/*
    - /harness/AGENTS.md
    - /harness/moon.yml
    - /harness/SOUL.md
    - /harness/USER.md
    - /harness/rules/agent-instructions.md
    - /harness/skills/*/SKILL.md
    - /.moon/tasks/harness-claude.yml
    - /.moon/tasks/harness-codex.yml
    - /.moon/tasks/harness-cursor.yml
    - /.moon/tasks/docker.yml
tasks:
  scrapling-mcp:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-scrapling-launcher.ts"
    inputs:
      - deploy-scrapling-launcher.ts
      - deploy-link.ts
      - scrapling-mcp
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  test:
    command: noop
    deps:
      - repository:typescript-test
      - upgrade-test
      - deployment-test
      - hunspell-test
      - agent-memory:deployment-test
      - agent-handoff:deployment-test
    toolchains: system
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - "@group(deploymentSources)"
      - /install.sh
  deployment-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 tooling/deployment-fish.test.ts tooling/deployment-links.test.ts tooling/deployment-xdg.test.ts tooling/deployment-moon.test.ts tooling/deploy-link.test.ts tooling/deploy-scrapling-launcher.test.ts tooling/assemble-agent-instructions.test.ts tooling/install-agent-skills.test.ts tooling/design-claim-audit.test.ts tooling/moon/optional-links.test.ts tooling/clean-deployment-worker-marker.test.ts tooling/clean-deployment-worker-owner.test.ts tooling/clean-deployment-worker-inspect.test.ts tooling/clean-deployment-remem.test.ts tooling/clean-deployment.test.ts tooling/clean-deployment-config.test.ts tooling/clean-deployment-semctx.test.ts tooling/clean-deployment-moon.test.ts tooling/clean-deployment-decoding.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(bunTestSupport)"
      - "@group(linkDeployment)"
      - /.moon/tasks/tests.yml
      - clean-deployment*.ts
      - clean-deployment-worker-inspect.js
      - deployment-fish.test.ts
      - deployment-xdg.test.ts
      - deployment-moon.test.ts
      - deployment-moon-test-support.ts
      - deployment-test-provider.ts
      - deploy-fish-plugins.ts
      - deploy-git-includes.ts
      - /home/.config/fish/**/*
      - /home/.config/git/**/*
      - /home/.config/wezterm/**/*
      - /.github/workflows/test-deployment.yml
  worker-native-test:
    command: bun --config=/dev/null --no-env-file test --timeout 30000 ./tooling/clean-deployment-worker-native.integration.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
      os: macos
    inputs:
      - "@group(bunTestSupport)"
      - clean-deployment-worker*
      - clean-deployment-paths.ts
      - deployment-test-support.ts
      - /.github/workflows/test-deployment.yml
  hunspell-test:
    command: bun --config=/dev/null --no-env-file test tooling/install-hunspell-dictionary.test.ts tooling/install-hunspell-dictionary-failures.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(bunTestSupport)"
      - install-hunspell-dictionary*
      - /home/moon.yml
      - /.github/workflows/test-deployment.yml
  upgrade-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 tooling/upgrade.test.ts tooling/upgrade-git.test.ts tooling/upgrade-node.test.ts tooling/node-version-installation.test.ts
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - upgrade
      - upgrade*.ts
      - node-version-*.ts
      - git-main-branch
      - git-main-branch-cli.ts
      - git-main-branch-core.ts
      - /package.json
      - /bun.lock
      - /.prototools
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /.github/workflows/check-shell.yml
  upgrade-neovim-test:
    command: bun --config=/dev/null --no-env-file test --timeout 30000 ./tooling/upgrade-neovim.integration.ts
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - /home/.config/nvim/upgrade.lua
      - /home/.config/nvim/lazy-lock.json
  installer-test:
    command: bun --config=/dev/null --no-env-file test tooling/install.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - install.test.ts
      - install-moon
      - /install.sh
      - /package.json
      - /bun.lock
      - /.prototools
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /.github/workflows/check-shell.yml
  docker-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 tooling/docker-install.test.ts tooling/docker-verify.test.ts tooling/scrapling-mcp.test.ts tooling/scrapling-image.test.ts tooling/cloakbrowser.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - docker-*.ts
      - install-docker-artifact*
      - scrapling-*.ts
      - scrapling-mcp
      - cloakbrowser*
      - /.moon/tasks/docker.yml
      - "@group(rootToolchain)"
  docker-smoke:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 ./tooling/docker-images.integration.ts tooling/scrapling-mcp.test.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      cache: false
    env:
      SCRAPLING_DOCKER_SMOKE: "1"
      SCRAPLING_DOCKER_CANONICAL_SMOKE: "1"
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
  smoke-minimal:
    command: bun tooling/smoke-minimal.ts
    deps:
      - repository:dependencies
    options:
      runFromWorkspaceRoot: true
      os: macos
      cache: false
    inputs:
      - "@group(toolingSources)"
      - "@group(rootToolchain)"
      - "@group(deploymentSources)"
      - /Brewfile
      - /install.sh
