tags:
  - rust-cli
env:
  RUSTFLAGS: -Funsafe-code
fileGroups:
  rust:
    - /.github/workflows/test-bitbucket-linear.yml
    - /home/.config/fish/conf.d/aliases.fish
tasks:
  build:
    deps:
      - repository:rust
    options:
      cache: false
      mutex: bitbucket-linear-cargo-target
      runInCI: false
    toolchains: rust
    command: cargo build --release --locked
  test:
    options:
      cache: false
      mutex: bitbucket-linear-cargo-target
