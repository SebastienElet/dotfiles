{
  fileGroups:
    {
      rust: [/.github/workflows/test-agent-memory.yml],
      deployment:
        [
          moon.yml,
          /.github/workflows/test-deployment.yml,
          /Makefile,
          /.moon/workspace.yml,
          /harness/moon.yml,
          /moon.yml,
          /tooling/deployment-agent-memory.test.ts,
          /tooling/deployment-moon-test-support.ts,
          /tooling/deployment-test-support.ts,
          /package.json,
          /bun.lock,
          /tsconfig.json,
        ],
    },
  tasks:
    {
      install:
        {
          description: Install the Agent Memory executable,
          command: noop,
          deps: [binary],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      binary:
        {
          script: "set -e\nmkdir -p \"$HOME/.local/bin\"\nln -s \"$projectRoot/target/release/agent-memory\" \"$HOME/.local/bin/agent-memory\"\n",
          deps: [build],
          checks:
            [
              {
                check: condition,
                script: 'test -e "$HOME/.local/bin/agent-memory" || test -L "$HOME/.local/bin/agent-memory"',
              },
            ],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      fmt: { env: { RUSTFLAGS: "-Funsafe-code" } },
      clippy:
        {
          env: { RUSTFLAGS: "-Funsafe-code" },
          options: { mutex: agent-memory-cargo-target },
        },
      test:
        {
          env: { RUSTFLAGS: "-Funsafe-code" },
          options: { mutex: agent-memory-cargo-target },
        },
      build:
        {
          script: "set -e\ncargo build --quiet --release --locked\ntest -x \"$projectRoot/target/release/agent-memory\" || { printf 'Agent Memory build produced no executable at %s\\n' \"$projectRoot/target/release/agent-memory\" >&2; exit 1; }\n",
          deps: [repository:rust],
          env: {},
          inputs: ["@group(rust)"],
          outputs: [target/release/agent-memory],
          options: { mutex: agent-memory-cargo-target },
        },
      deployment-test:
        {
          command: bun --config=/dev/null --no-env-file test tooling/deployment-agent-memory.test.ts,
          inputs: ["@group(deployment)", "@group(rust)"],
          toolchains: bun,
          options: { runFromWorkspaceRoot: true },
        },
    },
  tags: [rust-cli],
  env: { PATH: "/opt/homebrew/bin:/usr/local/bin:${PATH}" },
}
