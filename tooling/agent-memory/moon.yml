fileGroups:
  rust:
    - Cargo.toml
    - Cargo.lock
    - src/**/*
    - tests/**/*
    - examples/**/*
    - benches/**/*
    - /.cargo/**/*
    - /.github/workflows/test-agent-memory.yml
    - /.moon/**/*

tasks:
  fmt:
    command: cargo fmt --check
    env:
      RUSTFLAGS: -Funsafe-code
    inputs:
      - "@group(rust)"
  clippy:
    command: cargo clippy --all-targets -- -D warnings
    env:
      RUSTFLAGS: -Funsafe-code
    inputs:
      - "@group(rust)"
    options:
      mutex: agent-memory-cargo-target
  test:
    command: cargo test
    env:
      RUSTFLAGS: -Funsafe-code
    inputs:
      - "@group(rust)"
    options:
      mutex: agent-memory-cargo-target
  build-release:
    command: cargo build --release
    inputs:
      - "@group(rust)"
    options:
      cache: false
