fileGroups:
  rust:
    - /.github/workflows/test-agent-memory.yml
  deployment:
    - moon.yml
    - Cargo.toml
    - Cargo.lock
    - build*.rs
    - src/**/*
    - /.moon/tasks/rust.yml
    - /.github/workflows/test-agent-memory.yml
    - /.prototools
    - /moon.yml
    - /tooling/clean-deployment*.ts
    - /tooling/clean-deployment-worker-inspect.js
    - /home/.arnes.yaml
    - /tooling/deployment-agent-memory.test.ts
    - /tooling/deployment-moon-runner.ts
    - /tooling/deployment-moon-test-support.ts
    - /tooling/deployment-test-support.ts
    - /tooling/deploy-link.ts
    - /harness/moon.yml
    - /harness/rules/memory-governance-cursor.mdc
    - /.moon/tasks/harness-cursor.yml
tasks:
  install:
    description: Install the Agent Memory executable
    command: noop
    deps:
      - binary
    toolchains: system
    options:
      cache: false
      runInCI: false
  binary:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/target/release/agent-memory" "$HOME/.local/bin/agent-memory"
    deps:
      - build
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  fmt:
    env:
      RUSTFLAGS: -Funsafe-code
  clippy:
    env:
      RUSTFLAGS: -Funsafe-code
    options:
      mutex: agent-memory-cargo-target
  test:
    env:
      RUSTFLAGS: -Funsafe-code
    options:
      mutex: agent-memory-cargo-target
  build:
    toolchains: rust
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      cargo build --quiet --release --locked
      test -x "$projectRoot/target/release/agent-memory" || { printf 'Agent Memory build produced no executable at %s\n' "$projectRoot/target/release/agent-memory" >&2; exit 1; }
    deps:
      - repository:rust
    inputs:
      - "@group(rust)"
    outputs:
      - target/release/agent-memory
    options:
      mutex: agent-memory-cargo-target
  deployment-test:
    command: bun --config=/dev/null --no-env-file test tooling/deployment-agent-memory.test.ts
    deps:
      - repository:rust
    inputs:
      - "@group(deployment)"
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
tags:
  - rust-cli
env: {}
