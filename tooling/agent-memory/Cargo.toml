[package]
name = "agent-memory"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Validated local memory storage and retrieval for coding agents."
license-file = "../../LICENSE"
repository = "https://github.com/SebastienElet/dotfiles"
readme = "../RUST.md"
keywords = ["dotfiles", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "forbid"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -2 }
nursery = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
integer_division = "deny"
wildcard_enum_match_arm = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
time = { version = "0.3.55", features = ["parsing"] }
rustix = { version = "1.1", features = ["fs", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.21"
url = "2.5"
unicode-normalization = "0.1.25"

[[test]]
name = "integration"
path = "tests/integration.rs"
