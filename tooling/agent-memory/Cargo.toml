[package]
name = "agent-memory"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
getrandom = "0.4"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
rustix = { version = "1.1", features = ["fs", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.21"
url = "2.5"
unicode-normalization = "0.1.25"
