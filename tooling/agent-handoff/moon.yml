fileGroups:
  rust:
    - /.github/workflows/test-agent-handoff.yml
  deployment:
    - moon.yml
    - Cargo.toml
    - Cargo.lock
    - build*.rs
    - src/**/*
    - /.moon/tasks/rust.yml
    - /.github/workflows/test-agent-handoff.yml
    - /.prototools
    - /moon.yml
    - /tooling/clean-deployment*.ts
    - /tooling/clean-deployment-worker-inspect.js
    - /home/.arnes.yaml
    - /tooling/deployment-agent-handoff.test.ts
    - /tooling/deployment-moon-runner.ts
    - /tooling/deployment-moon-test-support.ts
    - /tooling/deployment-test-support.ts
    - /tooling/deploy-link.ts
env:
  RUSTFLAGS: -Funsafe-code
tasks:
  install:
    description: Install the Agent Handoff executable
    command: noop
    deps:
      - binary
    toolchains: system
    options:
      cache: false
      runInCI: false
  binary:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/target/release/agent-handoff" "$HOME/.local/bin/agent-handoff"
    deps:
      - build
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  clippy:
    options:
      mutex: agent-handoff-cargo-target
  test:
    options:
      mutex: agent-handoff-cargo-target
  build:
    toolchains: rust
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      cargo build --quiet --release --locked
      test -x "$projectRoot/target/release/agent-handoff" || { printf 'Agent Handoff build produced no executable at %s\n' "$projectRoot/target/release/agent-handoff" >&2; exit 1; }
    deps:
      - repository:rust
    inputs:
      - "@group(rust)"
    outputs:
      - target/release/agent-handoff
    options:
      mutex: agent-handoff-cargo-target
  deployment-test:
    command: bun --config=/dev/null --no-env-file test tooling/deployment-agent-handoff.test.ts
    deps:
      - repository:rust
    inputs:
      - "@group(deployment)"
    toolchains: bun
    options:
      runFromWorkspaceRoot: true
tags:
  - rust-cli
