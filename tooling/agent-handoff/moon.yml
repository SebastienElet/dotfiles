{
  fileGroups:
    {
      rust: [/.github/workflows/test-agent-handoff.yml],
      deployment:
        [
          moon.yml,
          /.github/workflows/test-deployment.yml,
          /Makefile,
          /.moon/workspace.yml,
          /harness/moon.yml,
          /moon.yml,
          /tooling/deployment-agent-handoff.test.ts,
          /tooling/deployment-moon-test-support.ts,
          /tooling/deployment-test-support.ts,
          /package.json,
          /bun.lock,
          /tsconfig.json,
        ],
    },
  env:
    {
      RUSTFLAGS: "-Funsafe-code",
      PATH: "/opt/homebrew/bin:/usr/local/bin:${PATH}",
    },
  tasks:
    {
      install:
        {
          description: Install the Agent Handoff executable,
          command: noop,
          deps: [binary],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      binary:
        {
          script: "set -e\nmkdir -p \"$HOME/.local/bin\"\nln -s \"$projectRoot/target/release/agent-handoff\" \"$HOME/.local/bin/agent-handoff\"\n",
          deps: [build],
          checks:
            [
              {
                check: condition,
                script: 'test -e "$HOME/.local/bin/agent-handoff" || test -L "$HOME/.local/bin/agent-handoff"',
              },
            ],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      clippy: { options: { mutex: agent-handoff-cargo-target } },
      test: { options: { mutex: agent-handoff-cargo-target } },
      build:
        {
          script: "set -e\ncargo build --quiet --release --locked\ntest -x \"$projectRoot/target/release/agent-handoff\" || { printf 'Agent Handoff build produced no executable at %s\\n' \"$projectRoot/target/release/agent-handoff\" >&2; exit 1; }\n",
          deps: [repository:rust],
          env: {},
          inputs: ["@group(rust)"],
          outputs: [target/release/agent-handoff],
          options: { mutex: agent-handoff-cargo-target },
        },
      deployment-test:
        {
          command: bun --config=/dev/null --no-env-file test tooling/deployment-agent-handoff.test.ts,
          inputs: ["@group(deployment)", "@group(rust)"],
          toolchains: bun,
          options: { runFromWorkspaceRoot: true },
        },
    },
  tags: [rust-cli],
}
