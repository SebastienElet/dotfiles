id = "dotfiles.worktree-cleanup"
name = "Worktree Cleanup"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Remove linked worktrees; set --docker-cleanup=stop to stop containers with an exact Compose working_dir label match"
platforms = ["macos"]

[[events]]
on = "workspace.closed"
command = ["bun", "--config=/dev/null", "--no-env-file", "remove-closed-worktree.ts", "--docker-cleanup=off"]
