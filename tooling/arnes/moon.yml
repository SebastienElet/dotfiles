{
  fileGroups:
    {
      rust: [/.github/workflows/test-arnes.yml],
      repositoryTests: [/Makefile, /home/.arnes.yaml, /harness/**/*],
    },
  env:
    {
      RUSTFLAGS: "-Funsafe-code",
      PATH: "/opt/homebrew/bin:/usr/local/bin:${PATH}",
    },
  tasks:
    {
      install:
        {
          description: Install the Arnes executable and manifest,
          command: noop,
          deps: [binary, home:arnes-config],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      build:
        {
          command: cargo build --quiet --release --locked,
          deps: [repository:rust],
          env: {},
          toolchains: system,
          options: { cache: false, mutex: arnes-cargo-target, runInCI: false },
        },
      binary:
        {
          script: "set -e\nmkdir -p \"$HOME/.local/bin\"\nln -s \"$projectRoot/target/release/arnes\" \"$HOME/.local/bin/arnes\"\n",
          deps: [build],
          checks:
            [
              {
                check: condition,
                script: 'test -e "$HOME/.local/bin/arnes" || test -L "$HOME/.local/bin/arnes"',
              },
            ],
          toolchains: system,
          options: { cache: false, runInCI: false },
        },
      clippy:
        {
          command: cargo clippy --all-targets --locked -- -D warnings,
          options: { mutex: arnes-cargo-target, mergeArgs: replace },
        },
      check:
        {
          command: cargo check --all-targets --locked,
          inputs: ["@group(rust)"],
          options: { mutex: arnes-cargo-target },
          deps: [repository:rust],
        },
      test:
        {
          command: cargo test --locked,
          options: { mutex: arnes-cargo-target, mergeArgs: replace },
          inputs: ["@group(repositoryTests)"],
        },
    },
  tags: [rust-cli],
}
