fileGroups:
  rust:
    - /.github/workflows/test-arnes.yml
  repositoryTests:
    - /home/.arnes.yaml
    - /harness/**/*
    - /home/moon.yml
    - /.moon/tasks/harness-codex.yml
    - /.moon/tasks/harness-claude.yml
    - /.moon/tasks/javascript.yml
    - /tooling/assemble-agent-instructions.ts
    - /tooling/agent-skill-source.ts
    - /tooling/install-agent-skills.ts
    - /tooling/deploy-link.ts
    - /package.json
    - /bun.lock
    - /tsconfig.json
env:
  RUSTFLAGS: -Funsafe-code
tasks:
  install:
    description: Install the Arnes executable and manifest
    command: noop
    deps:
      - binary
      - home:arnes-config
    toolchains: system
    options:
      cache: false
      runInCI: false
  build:
    deps:
      - repository:rust
    toolchains: rust
    options:
      cache: false
      mutex: arnes-cargo-target
      runInCI: false
    script: |-
      set -e
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      cargo install --git https://github.com/SebastienElet/arnes --rev 8ccea927ad08d627c5192765d85fd318000dd8d4 --locked --root "$projectRoot/target/read-only" --target-dir "$projectRoot/target/read-only-build"
      mkdir -p "$projectRoot/target/release"
      cp "$projectRoot/target/read-only/bin/arnes" "$projectRoot/target/release/arnes"
  binary:
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$projectRoot/target/release/arnes" "$HOME/.local/bin/arnes"
    deps:
      - build
      - repository:dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
  clippy:
    options:
      mutex: arnes-cargo-target
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  check:
    inputs:
      - "@group(rust)"
    options:
      mutex: arnes-cargo-target
    deps:
      - repository:rust
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      cargo check --workspace --all-targets --all-features --locked
  test:
    toolchains: [rust, bun]
    options:
      mutex: arnes-cargo-target
    inputs:
      - "@group(repositoryTests)"
    deps:
      - repository:dependencies
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      cargo test --workspace --all-features --locked
tags:
  - rust-cli
