version: 1
repository:
  root: home
  path: .dotfiles
agents:
  - id: claude
    scopes: [user]
resources:
  - id: instructions
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .claude/CLAUDE.md }
  - id: instructions
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/SOUL.md }
    destination: { root: home, path: .claude/SOUL.md }
