version: 1
agents:
  - id: claude
    scopes: [user, project]
resources:
  - id: claude-user-instructions
    kind: instructions
    agent: claude
    scope: user
    source:
      root: repository
      path: harness/AGENTS.md
    destination:
      root: home
      path: .claude/CLAUDE.md
  - id: claude-project-instructions
    kind: instructions
    agent: claude
    scope: project
    source:
      root: repository
      path: harness/AGENTS.md
    destination:
      root: repository
      path: CLAUDE.md
