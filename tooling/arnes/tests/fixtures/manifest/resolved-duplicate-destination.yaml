version: 1
repository: { root: home, path: .dotfiles }
agents:
  - id: claude
    scopes: [user, project]
resources:
  - id: user-instructions
    kind: instructions
    agent: claude
    scope: user
    source: { root: repository, path: harness/AGENTS.md }
    destination: { root: home, path: .dotfiles/CLAUDE.md }
  - id: project-instructions
    kind: instructions
    agent: claude
    scope: project
    source: { root: repository, path: harness/SOUL.md }
    destination: { root: repository, path: CLAUDE.md }
