language: typescript
tags:
  - repository
tasks:
  install:
    description: Install the minimal workstation
    command: noop
    deps:
      - applications-install
      - grokbot
      - codex-quota
      - pnpm
      - home:install
      - harness:install
      - jq-setup
      - secret-prepare
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
  optional:
    description: Install the optional workstation profile
    command: noop
    deps:
      - repository:install
      - repository:bundle-optional
      - repository:optional-artifacts
    toolchains: system
    options:
      cache: false
      os: macos
      runDepsInParallel: false
      runInCI: false
  optional-artifacts:
    description: Install the optional workstation artifacts
    command: noop
    deps:
      - repository:dependencies
      - repository:node
      - harness:cursor
      - harness:agent-reach
      - home:postgresql
      - repository:daisydisk
      - repository:things-3
      - repository:lumen
    toolchains: system
    options:
      cache: false
      os: macos
      runDepsInParallel: false
      runInCI: false
  check:
    description: Run repository static checks
    command: noop
    deps:
      - typescript-lint
      - typescript-typecheck
      - typescript-format-check
      - prettier-check
      - shell-lint
      - workflows-lint
      - cspell-check
      - neovim-lint
      - wezterm-lint
      - fish-syntax
      - fish-format
      - secret-scan
      - arnes:fmt
      - arnes:clippy
      - arnes:check
    toolchains: system
  test:
    description: Run repository behavior tests
    command: noop
    deps:
      - fish-test
      - tooling:test
      - secret-test
      - arnes:test
    toolchains: system
