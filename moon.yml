language: typescript
tags:
  - repository
tasks:
  clean:
    description: Remove owned deployed artifacts from both workstation profiles
    command: bun --config=/dev/null --no-env-file tooling/clean-deployment.ts "$workspaceRoot" "$HOME" --apply
    deps:
      - dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: false
    inputs:
      - /tooling/clean-deployment*.ts
      - /tooling/clean-deployment-worker-inspect.js
      - /home/.arnes.yaml
  install:
    description: Install the minimal workstation
    command: noop
    deps:
      - applications-install
      - pnpm
      - home:install
      - harness:install
      - jq-setup
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
  optional-artifacts:
    description: Install the optional workstation artifacts
    command: noop
    deps:
      - repository:dependencies
      - repository:node
      - harness:cursor
      - repository:cloakbrowser
      - repository:scrapling
      - home:postgresql
      - repository:daisydisk
      - repository:things-3
      - repository:lumen
    toolchains: system
    options:
      cache: false
      os: macos
      runDepsInParallel: false
      runInCI: false
  check:
    description: Run repository static checks
    command: noop
    deps:
      - typescript-lint
      - typescript-typecheck
      - typescript-format-check
      - prettier-check
      - shell-lint
      - workflows-lint
      - cspell-check
      - neovim-lint
      - wezterm-lint
      - fish-syntax
      - fish-format
      - arnes:fmt
      - arnes:clippy
      - arnes:check
      - bitbucket-linear-sync:fmt
      - bitbucket-linear-sync:clippy
      - bitbucket-linear-sync:check
      - agent-memory:fmt
      - agent-memory:clippy
      - agent-handoff:fmt
      - agent-handoff:clippy
      - proof-integrity:fmt
      - proof-integrity:clippy
      - proof-integrity:check
    toolchains: system
  test:
    description: Run repository behavior tests
    command: noop
    deps:
      - fish-test
      - tooling:test
      - arnes:test
      - bitbucket-linear-sync:test
      - agent-memory:test
      - agent-handoff:test
      - proof-integrity:test
    toolchains: system
