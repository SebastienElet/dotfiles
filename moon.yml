language: typescript

fileGroups:
  trackedTypeScript:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  typecheckedTypeScript:
    - tooling/**/*.ts
    - .agents/skills/apple-notes/scripts/**/*.ts
  typescriptToolchain:
    - package.json
    - bun.lock
    - .moon/workspace.yml
    - .moon/toolchains.yml
    - moon.yml
    - .github/workflows/check-typescript.yml
  prettierFiles:
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.json"
    - "!home/.config/nvim/lazy-lock.json"
    - "!home/.config/nvim/lazyvim.json"
  fishGate:
    - home/.config/fish/**/*.fish
    - moon.yml
    - .moon/workspace.yml
    - .github/workflows/test-fish.yml
  fishBehaviorDependencies:
    - .gitignore
    - tooling/git-main-branch
    - tooling/git-main-branch-*.ts
    - package.json
    - bun.lock
  hunspellTests:
    - tooling/install-hunspell-dictionary
    - tooling/install-hunspell-dictionary*.ts
    - package.json
    - bun.lock
    - tsconfig.json
    - .github/workflows/test-deployment.yml

tasks:
  install:
    description: Install the workstation
    command: noop
    deps:
      - applications-install
      - harness:install
      - hunspell-dictionaries
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
  homebrew:
    description: Install Homebrew
    script: |
      set -e
      homebrew_installer=$(curl -fsSL --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)
      /bin/bash -c "$homebrew_installer"
    checks:
      - check: condition
        script: command -v brew
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:${PATH}
    toolchains: system
    options:
      cache: false
      interactive: true
      mutex: homebrew
      os: macos
      runInCI: false
  applications-install:
    description: Install the minimal Brewfile
    command: brew bundle install --no-upgrade --file Brewfile
    deps:
      - homebrew
    checks:
      - check: condition
        script: brew bundle check --quiet --no-upgrade --file Brewfile
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:${PATH}
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
  rust:
    description: Install Rust and Cargo with Homebrew
    command: brew install rust
    deps:
      - homebrew
    checks:
      - check: condition
        script: brew list --formula --versions rust
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:${PATH}
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: skip
  hunspell-dictionaries:
    description: Install Hunspell dictionaries
    script: |
      set -e
      tooling/install-hunspell-dictionary "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.aff" "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5" "$HOME/Library/Spelling/fr.aff"
      tooling/install-hunspell-dictionary "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/fr_FR/dictionaries/fr.dic" "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c" "$HOME/Library/Spelling/fr.dic"
      tooling/install-hunspell-dictionary "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.aff" "e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e" "$HOME/Library/Spelling/en_US.aff"
      tooling/install-hunspell-dictionary "https://raw.githubusercontent.com/LibreOffice/dictionaries/f2ff99058268502bdcf4cad25c1ca2935ad8aa7d/en/en_US.dic" "f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647" "$HOME/Library/Spelling/en_US.dic"
    inputs:
      - tooling/install-hunspell-dictionary
      - tooling/install-hunspell-dictionary-error.ts
      - tooling/install-hunspell-dictionary-files.ts
      - tooling/install-hunspell-dictionary.ts
    toolchains: bun
    options:
      cache: false
      os: macos
      runInCI: false
  hunspell-test:
    command: >-
      bun --config=/dev/null --no-env-file test
      tooling/install-hunspell-dictionary.test.ts
      tooling/install-hunspell-dictionary-failures.test.ts
    inputs:
      - "@group(hunspellTests)"
  typescript-lint:
    command: bun --config=/dev/null --no-env-file tooling/lint-typescript.ts
    inputs:
      - "@group(trackedTypeScript)"
      - "@group(typescriptToolchain)"
      - .oxlintrc.json
      - tsconfig.json
  typescript-typecheck:
    command: bun --config=/dev/null --no-env-file run typecheck
    inputs:
      - "@group(typecheckedTypeScript)"
      - "@group(typescriptToolchain)"
      - tsconfig.json
  typescript-format-check:
    command: bun run format:typescript:check
    inputs:
      - "@group(trackedTypeScript)"
      - "@group(typescriptToolchain)"
  prettier-check:
    command: >-
      bun run prettier --check "**/*.{yml,yaml,md,json}"
      "!home/.config/nvim/lazy-lock.json"
      "!home/.config/nvim/lazyvim.json"
    inputs:
      - "@group(prettierFiles)"
      - bun.lock
  fish-setup:
    script: |
      set -euo pipefail
      if command -v fish > /dev/null; then
        exit 0
      fi
      case "$(uname -s)" in
        Darwin) brew install fish ;;
        Linux)
          sudo apt-get update
          sudo apt-get install -y fish
          ;;
        *) printf 'Fish gates do not support this operating system\n' >&2; exit 1 ;;
      esac
    toolchains: system
    options:
      cache: false
      mutex: homebrew
  fish-syntax:
    script: |
      set -euo pipefail
      fish_files=$(git ls-files 'home/.config/fish/*.fish' 'home/.config/fish/**/*.fish')
      printf '%s\n' "$fish_files" | grep -qx home/.config/fish/config.fish
      printf '%s\n' "$fish_files" | xargs -I{} fish --no-execute {}
    deps: [fish-setup]
    inputs: ["@group(fishGate)"]
    tags: [fish]
    toolchains: system
  fish-format:
    script: |
      set -euo pipefail
      fish_files=$(git ls-files 'home/.config/fish/*.fish' 'home/.config/fish/**/*.fish')
      printf '%s\n' "$fish_files" | grep -qx home/.config/fish/config.fish
      for file in $fish_files; do
        fish_indent --check "$file"
      done
    deps: [fish-setup]
    inputs: ["@group(fishGate)"]
    tags: [fish]
    toolchains: system
  fish-test:
    script: |
      set -euo pipefail
      fish --no-config home/.config/fish/tests/git_cleanup_test.fish
      fish --no-config home/.config/fish/tests/git_main_branch_test.fish
      fish --no-config home/.config/fish/tests/path_test.fish
      fish --no-config home/.config/fish/tests/runtime_state_test.fish
    deps: [fish-setup]
    inputs: ["@group(fishGate)", "@group(fishBehaviorDependencies)"]
    tags: [fish]
    toolchains: system
