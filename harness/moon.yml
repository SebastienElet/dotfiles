language: typescript
layer: configuration

fileGroups:
  evaluation:
    - cases.json
    - selection.json
    - instructions.md
    - fixtures/**/*
    - variants/**/*
    - evidence/**/*
    - skills/**/*
    - AGENTS.md
    - USER.md
    - SOUL.md
    - /package.json
    - /bun.lock
    - /.moon/**/*
    - /.github/actions/setup-moon/package.json
    - /.github/actions/setup-moon/bun.lock
    - /moon.yml
    - /.github/workflows/test-harness.yml

taskOptions:
  cache: false
  runFromWorkspaceRoot: true
  runInCI: false
tasks:
  agent-reach:
    description: Install the complete Agent-Reach plugin and macOS backends
    command: noop
    deps: [agent-reach-install-check]
    toolchains: system
    options: { os: macos }
  agent-reach-runtime:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts runtime "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:uv-setup]
    toolchains: bun
    options: { os: macos, mutex: agent-reach-uv }
  agent-reach-python:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts python "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:uv-setup]
    toolchains: bun
    options: { os: macos, mutex: agent-reach-uv }
  agent-reach-node:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts node "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:node]
    toolchains: bun
    options: { os: macos, mutex: volta }
  agent-reach-backends:
    command: docker compose --file "$HOME/.config/agent-reach/compose.yaml" pull linkedin
    deps:
      [
        agent-reach-python,
        agent-reach-node,
        repository:gh-setup,
        repository:google-chrome,
        repository:agent-reach-media,
        home:agent-reach,
      ]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker }
  agent-reach-package:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts package "$workspaceRoot" "$HOME"
    deps: [repository:dependencies]
    inputs: [/package.json, /bun.lock, /tooling/agent-reach.ts]
    toolchains: bun
    options: { mutex: harness-mutation }
  agent-reach-claude:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts claude "$workspaceRoot" "$HOME"
    deps: [agent-reach-package, claude-binary, claude-instructions]
    toolchains: bun
    options: { os: macos, mutex: harness-mutation }
  agent-reach-codex:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts codex "$workspaceRoot" "$HOME"
    deps: [agent-reach-package, codex-binary, codex-instructions]
    toolchains: bun
    options: { os: macos, mutex: harness-mutation }
  agent-reach-check:
    description: Audit required Agent-Reach plugins without installing them
    script: |-
      set -e
      cmp "$workspaceRoot/home/.arnes.yaml" "$HOME/.arnes.yaml"
      arnes doctor skills --agent claude --scope user
      arnes doctor skills --agent codex --scope user
      arnes doctor skills --agent cursor --scope user
    toolchains: system
    options: { cache: false, os: macos }
  agent-reach-cursor:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts cursor "$workspaceRoot" "$HOME"
    deps: [agent-reach-package]
    inputs:
      [
        /tooling/agent-reach-cursor.ts,
        /tooling/agent-reach-config.ts,
        /tooling/agent-reach-files.ts,
      ]
    toolchains: bun
    options: { cache: false, os: macos, mutex: harness-mutation }
  agent-reach-install-check:
    script: |-
      set -e
      cmp "$workspaceRoot/home/.arnes.yaml" "$HOME/.arnes.yaml"
      arnes doctor skills --agent claude --scope user
      arnes doctor skills --agent codex --scope user
      arnes doctor skills --agent cursor --scope user
      agent-reach --version
      mcporter --config "$HOME/.config/agent-reach/mcporter.json" config list --json
    deps:
      [
        agent-reach-runtime,
        agent-reach-backends,
        agent-reach-claude,
        agent-reach-codex,
        agent-reach-cursor,
        arnes:install,
        home:arnes-config,
      ]
    toolchains: system
    options: { os: macos }
  agent-reach-linkedin-start:
    command: docker compose --file "$HOME/.config/agent-reach/compose.yaml" up --detach linkedin
    deps: [home:agent-reach]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker }
  agent-reach-linkedin-login:
    script: |-
      set -e
      docker compose --file "$HOME/.config/agent-reach/compose.yaml" stop linkedin
      docker compose --file "$HOME/.config/agent-reach/compose.yaml" run --rm --name agent-reach-linkedin-login --service-ports linkedin --login --login-viewer
    deps: [home:agent-reach]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker, interactive: true }
  check:
    description: Validate the harness deterministically without an agent or LLM
    command: noop
    deps:
      - validate-instructions
      - validate-evals
      - validate-evidence
      - test-eval-runner
      - arnes:fmt
      - arnes:clippy
      - arnes:check
      - repository:typescript-lint
      - repository:typescript-typecheck
      - repository:typescript-format-check
      - repository:prettier-check
    options:
      runInCI: true
  validate-instructions:
    command: bun --config=/dev/null --no-env-file tooling/check-harness-instructions.ts harness
    toolchains: bun
    deps:
      - repository:dependencies
    inputs:
      - AGENTS.md
      - instructions.md
      - /tooling/check-harness-instructions.ts
      - /tooling/check-command.ts
      - /package.json
      - /bun.lock
      - /.moon/**/*
      - moon.yml
      - /.github/workflows/test-harness.yml
    options:
      runInCI: true
  validate-evals:
    command: node_modules/.bin/agent-experiments validate-evals --repository harness
    toolchains: bun
    deps:
      - repository:dependencies
    inputs:
      - "@group(evaluation)"
    options:
      runInCI: true
  validate-evidence:
    command: node_modules/.bin/agent-experiments validate-evidence --repository harness
    toolchains: bun
    deps:
      - repository:dependencies
    inputs:
      - "@group(evaluation)"
    options:
      runInCI: true
  test-eval-runner:
    command: node_modules/.bin/agent-experiments fixture-smoke --repository harness
    toolchains: bun
    deps:
      - repository:dependencies
    inputs:
      - "@group(evaluation)"
    options:
      runInCI: true
  eval:
    description: Manually run selected live Codex evaluations using LLM quota
    command: node_modules/.bin/agent-experiments run --repository harness
    toolchains: bun
    deps:
      - repository:dependencies
  compare:
    description: Compare reports with identical recorded experimental controls
    command: node_modules/.bin/agent-experiments compare
    toolchains: bun
    deps:
      - repository:dependencies
  install:
    description: Install migrated harness capabilities
    command: noop
    deps:
      - claude
      - codex
      - arnes:install
      - agent-handoff
      - assertledger
    toolchains: system
  agent-handoff:
    description: Deploy the published Agent Handoff executable
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/.bin/agent-handoff" "$HOME/.local/bin/agent-handoff"
    deps:
      - repository:dependencies
    toolchains: bun
  assertledger:
    description: Install the pinned AssertLedger CLI and its managed Node launcher
    command: bun --config=/dev/null --no-env-file tooling/install-assertledger.ts "$workspaceRoot" "$HOME"
    deps:
      - assertledger-package
    toolchains: bun
    options:
      os: macos
  assertledger-package:
    description: Install the pinned AssertLedger CLI with Bun
    script: |-
      set -e
      . ./node_modules/@sebastienelet/agent-skills/skills/assertledger/version.env
      bun --config=/dev/null --no-env-file install --global --exact --ignore-scripts "assertledger@$ASSERTLEDGER_VERSION"
    checks:
      - check: condition
        script: |-
          set -e
          . ./node_modules/@sebastienelet/agent-skills/skills/assertledger/version.env
          installed_assertledger_version=$("$HOME/.volta/bin/node" "$HOME/.bun/install/global/node_modules/assertledger/dist/cli.js" --version)
          test "$installed_assertledger_version" = "assertledger $ASSERTLEDGER_VERSION"
    deps:
      - repository:dependencies
      - repository:node
    toolchains: bun
    options:
      os: macos
      mutex: bun-global
tags:
  - harness
