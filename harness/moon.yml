language: typescript
layer: configuration

fileGroups:
  evaluation:
    - evals/**/*
    - skills/**/*
    - AGENTS.md
    - USER.md
    - SOUL.md
    - /tooling/arnes/src/**/*
    - /tooling/arnes/Cargo.toml
    - /tooling/arnes/Cargo.lock
    - /.cargo/**/*
    - /package.json
    - /bun.lock
    - /.moon/**/*
    - /.prototools
    - /rust-toolchain.toml
    - /moon.yml
    - /.github/workflows/test-harness.yml

taskOptions:
  cache: false
  runFromWorkspaceRoot: true
  runInCI: false
tasks:
  prime-agent:
    description: Install the stable Prime Agent CLI
    script: |-
      set -euo pipefail
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      installer=$(curl -fsSL --connect-timeout 10 --max-time 60 https://app.primeintellect.ai/prime-agent/install.sh)
      printf '%s\n' "$installer" | PRIME_AGENT_RELEASE_CHANNEL=stable sh
      "$HOME/.local/bin/prime-agent" --version
      "$HOME/.local/bin/prime-agent" --help >/dev/null
    checks:
      - check: condition
        script: test -x "$HOME/.local/bin/prime-agent" && "$HOME/.local/bin/prime-agent" --version >/dev/null
    deps: [repository:uv-setup]
    toolchains: system
    options: { os: macos }
  agent-reach:
    description: Install the complete Agent-Reach plugin and macOS backends
    command: noop
    deps: [agent-reach-check]
    toolchains: system
    options: { os: macos }
  agent-reach-runtime:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts runtime "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:uv-setup]
    toolchains: bun
    options: { os: macos, mutex: agent-reach-uv }
  agent-reach-python:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts python "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:uv-setup]
    toolchains: bun
    options: { os: macos, mutex: agent-reach-uv }
  agent-reach-node:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts node "$workspaceRoot" "$HOME"
    deps: [repository:dependencies, repository:node]
    toolchains: bun
    options: { os: macos, mutex: volta }
  agent-reach-backends:
    command: docker compose --file "$HOME/.config/agent-reach/compose.yaml" pull linkedin
    deps:
      [
        agent-reach-python,
        agent-reach-node,
        repository:gh-setup,
        repository:google-chrome,
        repository:agent-reach-media,
        home:agent-reach,
      ]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker }
  agent-reach-package:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts package "$workspaceRoot" "$HOME"
    deps: [repository:dependencies]
    inputs:
      [
        plugins/agent-reach/source.json,
        plugins/agent-reach/SKILL.md,
        /tooling/agent-reach-package.ts,
        /tooling/agent-reach-source.ts,
        /tooling/agent-reach.ts,
      ]
    toolchains: bun
    options: { mutex: harness-mutation }
  agent-reach-claude:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts claude "$workspaceRoot" "$HOME"
    deps: [agent-reach-package, claude-binary, claude-instructions]
    toolchains: bun
    options: { os: macos, mutex: harness-mutation }
  agent-reach-codex:
    command: bun --config=/dev/null --no-env-file tooling/agent-reach.ts codex "$workspaceRoot" "$HOME"
    deps: [agent-reach-package, codex-binary, codex-instructions]
    toolchains: bun
    options: { os: macos, mutex: harness-mutation }
  agent-reach-check:
    script: |-
      set -e
      arnes doctor skills --agent claude --scope user
      arnes doctor skills --agent codex --scope user
      agent-reach --version
      mcporter --config "$HOME/.config/agent-reach/mcporter.json" config list --json
    deps:
      [
        agent-reach-runtime,
        agent-reach-backends,
        agent-reach-claude,
        agent-reach-codex,
        arnes:install,
        home:arnes-config,
      ]
    toolchains: system
    options: { os: macos }
  agent-reach-linkedin-start:
    command: docker compose --file "$HOME/.config/agent-reach/compose.yaml" up --detach linkedin
    deps: [home:agent-reach]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker }
  agent-reach-linkedin-login:
    script: |-
      set -e
      docker compose --file "$HOME/.config/agent-reach/compose.yaml" stop linkedin
      docker compose --file "$HOME/.config/agent-reach/compose.yaml" run --rm --name agent-reach-linkedin-login --service-ports linkedin --login --login-viewer
    deps: [home:agent-reach]
    toolchains: system
    options: { os: macos, mutex: agent-reach-docker, interactive: true }
  check:
    description: Validate the harness deterministically without an agent or LLM
    command: noop
    deps:
      - validate-evals
      - validate-evidence
      - test-eval-runner
      - arnes:fmt
      - arnes:clippy
      - arnes:check
      - proof-integrity:fmt
      - proof-integrity:clippy
      - proof-integrity:test
      - repository:typescript-lint
      - repository:typescript-typecheck
      - repository:typescript-format-check
      - repository:prettier-check
    options:
      runInCI: true
  validate-evals:
    command: cargo run --quiet --locked --manifest-path tooling/arnes/Cargo.toml -- eval validate-evals
    toolchains: rust
    deps:
      - repository:rust
    inputs:
      - "@group(evaluation)"
      - /.agents/skills/**/evals/trigger-queries.json
    options:
      runInCI: true
      mutex: arnes-cargo-target
  validate-evidence:
    command: cargo run --quiet --locked --manifest-path tooling/arnes/Cargo.toml -- eval validate-evidence
    toolchains: rust
    deps:
      - repository:rust
    inputs:
      - "@group(evaluation)"
    options:
      runInCI: true
      mutex: arnes-cargo-target
  test-eval-runner:
    command: noop
    deps:
      - arnes:test
    inputs:
      - "@group(evaluation)"
    options:
      runInCI: true
  eval:
    description: Manually run selected live Codex evaluations using LLM quota
    command: cargo run --quiet --locked --manifest-path tooling/arnes/Cargo.toml -- eval run
    toolchains: rust
    deps:
      - repository:rust
    options:
      mutex: arnes-cargo-target
  compare:
    description: Compare reports with identical recorded experimental controls
    command: cargo run --quiet --locked --manifest-path tooling/arnes/Cargo.toml -- eval compare
    toolchains: rust
    deps:
      - repository:rust
    options:
      mutex: arnes-cargo-target
  install:
    description: Install migrated harness capabilities
    command: noop
    deps:
      - claude
      - codex
      - arnes:install
      - agent-handoff
      - assertledger
    toolchains: system
  agent-handoff:
    description: Deploy the published Agent Handoff executable
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/.bin/agent-handoff" "$HOME/.local/bin/agent-handoff"
    deps:
      - repository:dependencies
    toolchains: bun
  assertledger:
    description: Install the pinned AssertLedger CLI with the Volta-managed npm
    script: |-
      set -e
      . ./harness/skills/assertledger/version.env
      VOLTA_HOME="$HOME/.volta" PATH="$HOME/.volta/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" "$HOME/.volta/bin/npm" install --global "assertledger@$ASSERTLEDGER_VERSION"
    checks:
      - check: condition
        script: |-
          set -e
          . ./harness/skills/assertledger/version.env
          test -x "$HOME/.volta/bin/assertledger" &&
            installed_assertledger_version=$(VOLTA_HOME="$HOME/.volta" PATH="$HOME/.volta/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" "$HOME/.volta/bin/assertledger" --version) &&
            test "$installed_assertledger_version" = "assertledger $ASSERTLEDGER_VERSION"
    deps:
      - repository:node
    toolchains: system
    options:
      os: macos
      mutex: volta
tags:
  - harness
