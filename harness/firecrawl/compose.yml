name: firecrawl

# Self-hosted Firecrawl for agent web search and scraping.
# Upstream compose builds from a checkout; this one uses the published images.
# Without SEARXNG_ENDPOINT, /search falls back to DuckDuckGo.

x-common: &common
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - backend
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

services:
  api:
    <<: *common
    image: ghcr.io/firecrawl/firecrawl:latest
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      MAX_CONCURRENT_JOBS: 3
      BROWSER_POOL_SIZE: 3
    ports:
      - "3002:3002"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 4G
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  playwright-service:
    <<: *common
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 5
    mem_limit: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  redis:
    <<: *common
    image: redis:alpine
    command: redis-server --bind 0.0.0.0

  rabbitmq:
    <<: *common
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  nuq-postgres:
    <<: *common
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

networks:
  backend:
    driver: bridge
