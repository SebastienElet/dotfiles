inheritedBy:
  tags:
    - harness
taskOptions:
  cache: false
  runInCI: false
  runFromWorkspaceRoot: true
tasks:
  codex:
    command: noop
    deps:
      - codex-binary
      - codex-instructions
      - codex-profile
      - codex-agents
      - codex-skills
    toolchains: system
  codex-binary:
    script: VOLTA_HOME="$HOME/.volta" PATH="$HOME/.volta/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" volta install @openai/codex
    deps:
      - repository:node
    checks:
      - check: condition
        script: test -x "$HOME/.volta/bin/codex"
    toolchains: system
    options:
      os: macos
      mutex: volta
  codex-instructions:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/assemble-agent-instructions.ts" "$workspaceRoot/harness" "$HOME/.codex/AGENTS.md"
    deps:
      - repository:dependencies
    toolchains: bun
  codex-profile:
    description: Deploy the launcher for explicitly requested Codex profiles
    command: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/tooling/codex-profile" "$HOME/.local/bin/codex-profile"
    deps: [repository:dependencies]
    inputs:
      - /tooling/codex-profile
      - /tooling/codex-profile.ts
      - /tooling/codex-profile-observation.ts
      - /tooling/codex-profile-git.ts
      - /tooling/codex-profile-launch.ts
      - /tooling/codex-profile-relay.ts
      - /tooling/deploy-link.ts
    toolchains: bun
  codex-agents:
    script: |-
      set -e
      mkdir -p "$HOME/.codex/agents"
      cp "$workspaceRoot/home/.codex/agents/design-claim-auditor.toml" "$HOME/.codex/agents/design-claim-auditor.toml"
    checks:
      - check: condition
        script: cmp -s "$(pwd -P)/home/.codex/agents/design-claim-auditor.toml" "$HOME/.codex/agents/design-claim-auditor.toml"
    toolchains: system
  codex-skills:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/install-agent-skills.ts" "$workspaceRoot" "$HOME" codex
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/@sebastienelet/proof-integrity-review/skills/proof-integrity-review" "$HOME/.agents/skills/proof-integrity-review"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/@sebastienelet/agent-handoff/skills/handoff" "$HOME/.agents/skills/handoff"
    deps:
      - repository:dependencies
      - repository:herdr-setup
    toolchains: bun
