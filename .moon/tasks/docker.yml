inheritedBy:
  tags:
    - repository
tasks:
  docker:
    description: Verify that the Docker CLI is available
    command: tooling/check-docker-cli
    inputs:
      - /tooling/check-docker-cli
    toolchains: system
    options:
      cache: false
  scrapling:
    description: Install the Scrapling MCP launcher and Docker image
    script: |-
      "$workspaceRoot/tooling/install-docker-artifact" install scrapling "${DOCKER_UNAVAILABLE_POLICY-require-docker}" "${SCRAPLING_IMAGE-pyd4vinci/scrapling}"
    deps:
      - docker
      - tooling:scrapling-mcp
    toolchains: bun
    options:
      cache: false
      runDepsInParallel: false
      runInCI: false
