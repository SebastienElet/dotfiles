inheritedBy:
  tags:
    - repository
tasks:
  bundle-optional:
    description: Install the optional packages and Brewfile
    deps:
      - repository:homebrew-catalog
      - repository:uv-setup
      - repository:gh-setup
      - repository:google-chrome
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          export HOMEBREW_DOTFILES_SKIP_PAID_APPS="${SKIP_PAID_APPS:-0}"
          brew bundle check --quiet --no-upgrade --file Brewfile.optional &&
            bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-installed homebrew.lock.json
    env:
      HOMEBREW_NO_ASK: "1"
      HOMEBREW_BUNDLE_MAS_SKIP: ""
    inputs:
      - Brewfile.optional
      - homebrew.lock.json
      - tooling/homebrew-lock.ts
    toolchains: bun
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      export HOMEBREW_DOTFILES_SKIP_PAID_APPS="${SKIP_PAID_APPS:-0}"
      set -e
      bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-catalog homebrew.lock.json Brewfile.optional
      brew bundle install --no-upgrade --file Brewfile.optional </dev/null
      bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-installed homebrew.lock.json
