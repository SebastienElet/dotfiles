inheritedBy:
  tags:
    - repository
fileGroups:
  shellSources:
    - "harness/plugins/**/<[!.]:1,>"
    - "tooling/**/<[!.]:1,>"
    - install.sh
    - "**/*.sh"
  shellSupport:
    - moon.yml
    - tooling/check-scripts.ts
    - package.json
    - bun.lock
    - .github/actions/setup-moon/package.json
    - .github/actions/setup-moon/bun.lock
    - .moon/toolchains.yml
    - .moon/workspace.yml
    - .moon/tasks/checks.yml
    - .moon/tasks/packages.yml
    - .moon/tasks/workstation.yml
    - .github/workflows/check-shell.yml
  skillMarkdown:
    - "harness/skills/**/*.md"
    - ".agents/skills/**/*.md"
  cspellFiles:
    - "home/cspell.json"
    - "home/.config/cspell/user.txt"
    - "harness/AGENTS.md"
    - "home/.codex/agents/design-claim-auditor.toml"
    - "tooling/design-claim-audit.test.ts"
    - "tooling/install-hunspell-dictionary*.ts"
    - "tooling/deployment-*.ts"
  prettierFiles:
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.json"
    - "!home/.config/nvim/lazy-lock.json"
    - "!home/.config/nvim/lazyvim.json"
  fishGate:
    - home/.config/fish/**/*.fish
    - moon.yml
    - .github/actions/setup-moon/package.json
    - .github/actions/setup-moon/bun.lock
    - .moon/workspace.yml
    - .moon/tasks/checks.yml
    - .moon/tasks/packages.yml
    - .moon/tasks/workstation.yml
    - .moon/tasks/javascript.yml
    - tooling/install-homebrew
    - package.json
    - bun.lock
    - .github/workflows/test-fish.yml
tasks:
  prettier-check:
    command: bun tooling/check-prettier.ts --check "**/*.{yml,yaml,md,json}"
    inputs:
      - "@group(prettierFiles)"
      - tooling/check-prettier.ts
      - tooling/skill-markdown-paths.ts
      - tooling/check-command.ts
      - bun.lock
      - .github/actions/setup-moon/package.json
      - .github/actions/setup-moon/bun.lock
      - .gitignore
      - file: .prettierignore
        optional: true
  shell-lint:
    options:
      cache: false
    deps:
      - shellcheck-setup
    inputs:
      - "@group(shellSources)"
      - "@group(shellSupport)"
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts shell
  shell-ci:
    command: bun tooling/check-scripts.ts shell-ci
    args:
      - "@group(shellSupport)"
      - --
    inputs:
      - "@group(shellSources)"
      - "@group(shellSupport)"
    options:
      cache: false
      affectedFiles: args
      shell: false
  workflows-lint:
    deps:
      - actionlint-setup
      - shellcheck-setup
    inputs:
      - .github/workflows/**/*
    toolchains: system
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/go/bin"
      actionlint
  cspell-check:
    command: bun tooling/check-cspell.ts
    args:
      - "@group(cspellFiles)"
    options:
      cache: false
      shell: false
    deps:
      - cspell-setup
    inputs:
      - "@group(cspellFiles)"
      - tooling/check-cspell.ts
      - tooling/check-command.ts
      - "@group(skillMarkdown)"
      - tooling/skill-markdown-paths.ts
      - home/moon.yml
      - tooling/deploy-link.ts
      - package.json
      - bun.lock
      - .github/actions/setup-moon/package.json
      - .github/actions/setup-moon/bun.lock
      - .github/workflows/check-text.yml
  fish-syntax:
    deps:
      - fish-setup
    inputs:
      - "@group(fishGate)"
      - tooling/check-scripts.ts
    tags:
      - fish
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts fish-syntax
  fish-format:
    deps:
      - fish-setup
    inputs:
      - "@group(fishGate)"
      - tooling/check-scripts.ts
    tags:
      - fish
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts fish-format
