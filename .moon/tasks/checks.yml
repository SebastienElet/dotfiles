inheritedBy:
  tags:
    - repository
fileGroups:
  shellSources:
    - tooling/**/*
    - install.sh
    - "**/*.sh"
  shellSupport:
    - moon.yml
    - tooling/check-scripts.ts
    - package.json
    - bun.lock
    - .prototools
    - .moon/toolchains.yml
    - .moon/workspace.yml
    - .moon/tasks/checks.yml
    - .moon/tasks/packages.yml
    - .moon/tasks/workstation.yml
    - .github/workflows/check-shell.yml
  skillMarkdown:
    - "harness/skills/**/*.md"
    - ".agents/skills/**/*.md"
  cspellFiles:
    - "home/cspell.json"
    - "home/.config/cspell/user.txt"
    - "harness/AGENTS.md"
    - "harness/skills/design-claim-audit/evals/trigger-queries.json"
    - "home/.codex/agents/design-claim-auditor.toml"
    - "harness/skills/issue-creation/evals/trigger-queries.json"
    - "harness/skills/memory-governance/evals/trigger-queries.json"
    - "harness/skills/obsidian-retrieval/evals/trigger-queries.json"
    - "harness/skills/pr-feedback/evals/trigger-queries.json"
    - "harness/skills/requirements-clarification/evals/trigger-queries.json"
    - "docs/requirements-clarification-validation.md"
    - "tooling/design-claim-audit.test.ts"
    - "tooling/obsidian-retrieval/contract.ts"
    - "tooling/obsidian-retrieval/contract.test.ts"
    - "tooling/obsidian-retrieval/default-corpus-contract.ts"
    - "tooling/obsidian-retrieval/evaluation-contract.ts"
    - "tooling/install-hunspell-dictionary*.ts"
    - "tooling/deployment-*.ts"
    - ".agents/skills/apple-notes/scripts/*.ts"
    - "tooling/apple-notes*.ts"
  prettierFiles:
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.json"
    - "!home/.config/nvim/lazy-lock.json"
    - "!home/.config/nvim/lazyvim.json"
  fishGate:
    - home/.config/fish/**/*.fish
    - moon.yml
    - .moon/workspace.yml
    - .github/workflows/test-fish.yml
tasks:
  prettier-check:
    command: bun tooling/check-prettier.ts --check "**/*.{yml,yaml,md,json}" "!home/.config/nvim/lazy-lock.json" "!home/.config/nvim/lazyvim.json"
    inputs:
      - "@group(prettierFiles)"
      - tooling/check-prettier.ts
      - tooling/skill-markdown-paths.ts
      - tooling/check-command.ts
      - bun.lock
  lua-lint:
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -euo pipefail
      test -f home/.config/nvim/init.lua
      test -f home/.config/wezterm/wezterm.lua
      luacheck home/.config/nvim --no-unused-args --no-max-line-length --globals vim
      luacheck home/.config/wezterm/wezterm.lua --no-max-line-length
    inputs:
      - home/.config/nvim/**/*.lua
      - home/.config/wezterm/wezterm.lua
      - .github/workflows/check-lua.yml
      - .github/workflows/check-typescript.yml
    toolchains: system
    deps:
      - luacheck-setup
  shell-lint:
    options:
      cache: false
    deps:
      - shellcheck-setup
    inputs:
      - "@group(shellSources)"
      - "@group(shellSupport)"
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts shell
  shell-ci:
    command: bun tooling/check-scripts.ts shell-ci
    args:
      - "@group(shellSupport)"
      - --
    inputs:
      - "@group(shellSources)"
      - "@group(shellSupport)"
    options:
      cache: false
      affectedFiles: args
      shell: false
  workflows-lint:
    deps:
      - actionlint-setup
      - shellcheck-setup
    inputs:
      - .github/workflows/**/*
    toolchains: system
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/go/bin"
      actionlint
  cspell-check:
    command: bun tooling/check-cspell.ts
    args:
      - "@group(cspellFiles)"
    options:
      cache: false
      shell: false
    deps:
      - cspell-setup
    inputs:
      - "@group(cspellFiles)"
      - tooling/check-cspell.ts
      - tooling/check-command.ts
      - "@group(skillMarkdown)"
      - tooling/skill-markdown-paths.ts
      - home/moon.yml
      - tooling/deploy-link.ts
      - package.json
      - bun.lock
      - .github/workflows/check-text.yml
  fish-syntax:
    deps:
      - fish-setup
    inputs:
      - "@group(fishGate)"
      - tooling/check-scripts.ts
    tags:
      - fish
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts fish-syntax
  fish-format:
    deps:
      - fish-setup
    inputs:
      - "@group(fishGate)"
      - tooling/check-scripts.ts
    tags:
      - fish
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun tooling/check-scripts.ts fish-format
