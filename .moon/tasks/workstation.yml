inheritedBy:
  tags:
    - repository
tasks:
  google-chrome:
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      brew install --cask google-chrome
    deps: [homebrew-catalog]
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew list --cask --versions google-chrome
    toolchains: system
    options: { cache: false, mutex: homebrew, os: macos, runInCI: false }
  agent-reach-media:
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      brew install yt-dlp ffmpeg
    deps: [homebrew-catalog]
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew list --formula --versions yt-dlp ffmpeg
    toolchains: system
    options: { cache: false, mutex: homebrew, os: macos, runInCI: false }
  homebrew:
    description: Install Homebrew
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      "$workspaceRoot/tooling/install-homebrew"
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          command -v brew
    toolchains: system
    options:
      cache: false
      interactive: true
      mutex: homebrew
      os: macos
      runInCI: skip
    deps:
      - bootstrap
  homebrew-catalog:
    description: Refuse Homebrew installations whose catalog differs from the lock
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-catalog homebrew.lock.json Brewfile
    deps:
      - homebrew
      - dependencies
    inputs:
      - homebrew.lock.json
      - Brewfile
      - tooling/homebrew-lock.ts
    toolchains: bun
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: skip
  applications-install:
    description: Install the minimal Brewfile
    deps:
      - homebrew-catalog
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew bundle check --quiet --no-upgrade --file Brewfile &&
            bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-installed homebrew.lock.json
    env:
      HOMEBREW_NO_ASK: "1"
    toolchains: bun
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      brew bundle install --no-upgrade --file Brewfile
      bun --config=/dev/null --no-env-file --no-install tooling/homebrew-lock.ts verify-installed homebrew.lock.json
  herdr:
    description: Install the optional Herdr agent multiplexer and configuration
    command: noop
    deps:
      - herdr-setup
      - herdr-plugin
      - home:herdr
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
  herdr-setup:
    description: Install the optional Herdr agent multiplexer
    deps:
      - homebrew-catalog
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew list --formula --versions herdr
    env:
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      brew install herdr
  herdr-cleanup-install:
    description: Install the published Herdr worktree cleanup package
    deps:
      - dependencies
    toolchains: bun
    inputs:
      - /home/.local/share/herdr-worktree-cleanup/package.json
      - /home/.local/share/herdr-worktree-cleanup/bun.lock
      - /tooling/deploy-link.ts
    options:
      cache: false
      os: macos
      runInCI: false
    script: |-
      set -e
      mkdir -p "$HOME/.local/share/herdr-worktree-cleanup"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/home/.local/share/herdr-worktree-cleanup/package.json" "$HOME/.local/share/herdr-worktree-cleanup/package.json"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/home/.local/share/herdr-worktree-cleanup/bun.lock" "$HOME/.local/share/herdr-worktree-cleanup/bun.lock"
      bun --config=/dev/null --no-env-file install --cwd "$HOME/.local/share/herdr-worktree-cleanup" --frozen-lockfile --ignore-scripts
  herdr-plugin:
    description: Link the Herdr worktree cleanup plugin
    deps:
      - herdr-cleanup-install
      - herdr-setup
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: false
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      herdr plugin link "$HOME/.local/share/herdr-worktree-cleanup/node_modules/@sebastienelet/herdr-worktree-cleanup"
  grokbot:
    description: Install the Grok Bot desktop app
    deps:
      - homebrew-catalog
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew list --cask --versions grok-bot
    env:
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      brew install --cask grok-bot
  lumen:
    description: Install the optional Lumen system monitor
    command: bun --config=/dev/null --no-env-file --no-install tooling/install-lumen.ts /Applications
    deps:
      - dependencies
    inputs:
      - /tooling/install-lumen.ts
    toolchains: bun
    options:
      cache: false
      os: macos
      runInCI: false
  apple-notes-exporter:
    description: Install Apple Notes Exporter from the pinned vendor release
    command: bun --config=/dev/null --no-env-file --no-install tooling/install-apple-notes-exporter.ts /Applications
    deps:
      - dependencies
    inputs:
      - tooling/install-apple-notes-exporter.ts
    toolchains: bun
    options:
      cache: false
      mutex: apple-notes-exporter
      os: macos
      runInCI: false
  codex-quota:
    description: Install codex-quota from the pinned Git revision
    deps:
      - rust
    toolchains: system
    options:
      cache: false
      mutex: cargo-install
      os: macos
      runInCI: false
    script: |-
      export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
      cargo install --git https://github.com/SebastienElet/codex-quota --rev 686734c85208af44c90201c3378e7f4c4c8b74dd --locked --quiet
  rust:
    description: Install the repository Rust toolchain with rustup
    checks:
      - check: condition
        script: |-
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          export RUSTUP_AUTO_INSTALL=0
          rustup show active-toolchain &&
            rustc --version &&
            cargo fmt --version &&
            cargo clippy --version
    inputs:
      - rust-toolchain.toml
    toolchains: system
    options:
      cache: false
      mutex: rustup
      runInCI: true
    script: |-
      export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
      set -euo pipefail
      case "$(uname -s)" in
        Darwin)
          if ! command -v rustup >/dev/null; then
            test "$(uname -m)" = arm64
            rustup_directory="$(mktemp -d)"
            trap 'rm -r "$rustup_directory"' EXIT
            rustup_init="$rustup_directory/rustup-init"
            curl --proto '=https' --tlsv1.2 -fsSL -o "$rustup_init" \
              https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-apple-darwin/rustup-init
            echo "ec1b9233e7f72990ecd8e62063fa7f6c3dfc2bec8e97f88bff165f9100ac696a  $rustup_init" |
              shasum -a 256 -c - > /dev/null
            chmod +x "$rustup_init"
            RUSTUP_INIT_SKIP_PATH_CHECK=yes "$rustup_init" -y --no-modify-path --default-toolchain none
          fi
          ;;
        Linux) command -v rustup ;;
        *) exit 1 ;;
      esac
      rustup toolchain install --no-self-update
      rustup show active-toolchain
      rustc --version
      cargo --version
  volta:
    description: Install Volta with Homebrew
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      brew install volta
    deps:
      - homebrew-catalog
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          brew list --formula --versions volta
    env:
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      os: macos
      runInCI: false
  node:
    description: Install the project Node version as the Volta default
    script: |
      set -e
      node_install_spec=$(bun --config=/dev/null --no-env-file --no-install tooling/node-version-contract.ts install-spec)
      VOLTA_HOME="$HOME/.volta" PATH="$PATH:/opt/homebrew/bin:/usr/local/bin" volta install "$node_install_spec"
    deps:
      - volta
    checks:
      - check: condition
        script: |
          repository_root=$(pwd -P)
          test -x "$HOME/.volta/bin/node" && cd / && VOLTA_HOME="$HOME/.volta" PATH="$HOME/.volta/bin:$PATH" bun --config=/dev/null --no-env-file --no-install "$repository_root/tooling/node-version-contract.ts" verify-runtime "$repository_root/package.json"
    toolchains: bun
    options:
      cache: false
      mutex: volta
      runInCI: false
  pnpm:
    description: Install the exact pnpm version with Volta
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      VOLTA_HOME="$HOME/.volta" volta install pnpm@12.15.0
    deps:
      - node
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          cd / && test "$(VOLTA_HOME="$HOME/.volta" "$HOME/.volta/bin/pnpm" --version)" = 12.15.0
    toolchains: system
    options:
      cache: false
      mutex: volta
      runInCI: false
  daisydisk:
    description: Verify the optional DaisyDisk application
    script: |-
      bun --config=/dev/null --no-env-file --no-install tooling/paid-apps-install.ts verify-app "${APP_BIN:-/Applications}/DaisyDisk.app"
    deps:
      - dependencies
    inputs:
      - tooling/paid-apps-install.ts
      - package.json
      - bun.lock
    toolchains: bun
    options:
      cache: false
      os: macos
      runInCI: false
  things-3:
    description: Verify the optional Things 3 application after preparing its CLI
    script: |-
      bun --config=/dev/null --no-env-file --no-install tooling/paid-apps-install.ts verify-app "${APP_BIN:-/Applications}/Things3.app"
    deps:
      - target: things3-cli-wrapper
        env:
          THINGS3_PAID_CONTEXT: "1"
    inputs:
      - tooling/paid-apps-install.ts
      - package.json
      - bun.lock
    toolchains: bun
    options:
      cache: false
      os: macos
      runInCI: false
  things3-cli-wrapper:
    description: Install the exact Things 3 CLI wrapper version with npm
    script: |-
      bun --config=/dev/null --no-env-file --no-install tooling/paid-apps-install.ts install-cli
    deps:
      - node
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          VOLTA_HOME="$HOME/.volta" volta list --format plain @dougskinner/thangs |
            grep -Fq 'package @dougskinner/thangs@1.0.2 '
    inputs:
      - tooling/paid-apps-install.ts
      - package.json
      - bun.lock
    toolchains: bun
    options:
      cache: false
      mutex: volta
      os: macos
      runInCI: false
  bootstrap:
    description: Verify macOS installation prerequisites
    command: noop
    checks:
      - |-
        export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
        command -v curl
      - |-
        export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
        command -v git
      - |-
        export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
        xcode-select --print-path
    toolchains: system
    options:
      cache: false
      os: macos
      runInCI: skip
