inheritedBy:
  tags:
    - harness
taskOptions:
  cache: false
  runInCI: false
  runFromWorkspaceRoot: true
tasks:
  remem:
    command: noop
    deps:
      - remem-codex
      - remem-hooks
      - remem-skills
      - remem-worker
      - codex-instructions
      - codex-hooks
    toolchains: system
    options:
      os: macos
  remem-binary:
    script: |-
      set -eu
      remem_installer="$(mktemp)"
      trap 'rm -f "$remem_installer"' EXIT
      curl -fsSL --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/majiayu000/remem/dc5bfc562a0eef4f652a9e6d9aedc5c6f9ab7e1d/install.sh -o "$remem_installer"
      REMEM_VERSION=v0.6.93 REMEM_NO_CONFIG=1 sh "$remem_installer"
    checks:
      - check: condition
        script: '"$HOME/.local/bin/remem" --version | grep -Fx "remem 0.6.93 (schema v92)"'
    toolchains: system
    options:
      os: macos
      mutex: harness-mutation
  remem-config:
    script: |-
      set -eu
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/home/.remem/config.toml" "$HOME/.remem/config.toml"
      "$HOME/.local/bin/remem" encrypt > /dev/null
      "$HOME/.local/bin/remem" model current > /dev/null
    deps:
      - remem-binary
      - repository:dependencies
    toolchains: bun
    options:
      os: macos
      mutex: harness-mutation
  remem-codex:
    script: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-codex-install.ts" "$workspaceRoot" "$HOME"
    deps:
      - remem-config
      - codex-binary
      - repository:dependencies
    toolchains: bun
    options:
      os: macos
      mutex: harness-mutation
  remem-claude:
    script: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-claude-install.ts" install "$HOME"
    deps:
      - remem-config
      - claude-binary
      - arnes:install
      - repository:dependencies
    checks:
      - check: condition
        script: '"$HOME/.local/bin/arnes" doctor mcp --agent claude --scope user --color never && bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-claude-install.ts" verify "$HOME"'
    toolchains: bun
    options:
      os: macos
      mutex: harness-mutation
  remem-hooks:
    script: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-hooks-install.ts" install "$HOME"
    deps:
      - remem-config
      - claude-hooks
      - codex-hooks
      - repository:dependencies
    checks:
      - check: condition
        script: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-hooks-install.ts" verify "$HOME"
    toolchains: bun
    options:
      os: macos
      mutex: harness-mutation
  remem-skills:
    script: |-
      set -eu
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/install-agent-skills.ts" "$workspaceRoot" "$HOME" codex
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/install-agent-skills.ts" "$workspaceRoot" "$HOME" claude
    deps:
      - repository:dependencies
    toolchains: bun
    options:
      mutex: harness-mutation
  remem-worker:
    script: bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/remem-worker-install.ts" "$HOME"
    deps:
      - remem-config
      - repository:dependencies
    toolchains: bun
    options:
      os: macos
      mutex: harness-mutation
