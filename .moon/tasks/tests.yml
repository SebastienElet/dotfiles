inheritedBy:
  tags:
    - repository
fileGroups:
  generalTypeScriptTests:
    - harness/plugins/agent-reach/**/*
    - tooling/**/*.ts
    - oxfmt.config.ts
    - tooling/**/*.json
    - tooling/**/*.md
    - "!tooling/{deployment-*,deploy-*,clean-deployment*,assemble-agent-instructions*,install-agent-skills*,install-hunspell-dictionary*,design-claim-audit*,gitleaks.test}.ts"
    - tooling/deploy-link.ts
    - .moon/tasks/docker.yml
    - tooling/check-docker-cli
    - tooling/install-moon
    - .github/actions/setup-moon/**/*
    - tooling/install-homebrew
    - home/.config/fish/conf.d/git_main_branch.fish
    - tooling/format-edited-file
    - tooling/upgrade
    - .cargo/**/*
    - rust-toolchain.toml
    - .moon/toolchains.yml
    - .moon/tasks/rust.yml
    - .moon/tasks/workstation.yml
    - .moon/tasks/javascript.yml
    - .moon/tasks/checks.yml
    - .moon/tasks/docker.yml
    - .oxlintrc.json
    - .github/actions/setup-moon/package.json
    - .github/actions/setup-moon/bun.lock
    - .github/dependabot.yml
    - install.sh
    - harness/USER.md
  fishBehaviorDependencies:
    - .gitignore
tasks:
  typescript-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 --path-ignore-patterns "tooling/{deployment-*,deploy-*,clean-deployment*,assemble-agent-instructions*,install-agent-skills*,install-hunspell-dictionary*,design-claim-audit*,gitleaks.test}.ts"
    deps:
      - fish-setup
      - rust
      - node-runtime-check
    inputs:
      - "@group(generalTypeScriptTests)"
      - "@group(typescriptToolchain)"
      - .github/workflows/test-typescript.yml
    options:
      cache: false
  fish-test:
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -euo pipefail
      fish --no-config home/.config/fish/tests/git_cleanup_test.fish
      fish --no-config home/.config/fish/tests/git_main_branch_test.fish
      fish --no-config home/.config/fish/tests/path_test.fish
      fish --no-config home/.config/fish/tests/runtime_state_test.fish
    deps:
      - fish-setup
      - dependencies
    inputs:
      - "@group(fishGate)"
      - "@group(fishBehaviorDependencies)"
    tags:
      - fish
    toolchains: bun
  node-runtime-check:
    command: bun --config=/dev/null --no-env-file tooling/node-version-contract.ts verify-runtime
    inputs:
      - package.json
      - tooling/node-version-contract.ts
    options:
      cache: false
