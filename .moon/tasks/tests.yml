inheritedBy:
  tags:
    - repository
fileGroups:
  generalTypeScriptTests:
    - tooling/**/*.ts
    - oxfmt.config.ts
    - tooling/**/*.json
    - tooling/**/*.md
    - "!tooling/{deployment-*,deploy-*,assemble-agent-instructions*,install-agent-skills*,install-hunspell-dictionary*,design-claim-audit*,code-search-*,colgrep-search*}.ts"
    - tooling/scrapling-mcp
    - tooling/install-homebrew
    - tooling/git-main-branch
    - tooling/format-edited-file
    - tooling/upgrade
    - tooling/agent-memory/Cargo.toml
    - tooling/agent-memory/Cargo.lock
    - tooling/agent-memory/moon.yml
    - tooling/agent-memory/build*.rs
    - tooling/agent-memory/src/**/*
    - .cargo/**/*
    - .moon/tasks/rust.yml
    - .moon/tasks/workstation.yml
    - .moon/tasks/javascript.yml
    - .moon/tasks/checks.yml
    - .oxlintrc.json
    - .prototools
    - .github/dependabot.yml
    - Makefile
    - install.sh
    - harness/USER.md
    - harness/skills/obsidian-retrieval/SKILL.md
    - harness/skills/obsidian-retrieval/references/obsidian-cli.md
    - harness/skills/obsidian-retrieval/evals/trigger-queries.json
  fishBehaviorDependencies:
    - .gitignore
    - tooling/git-main-branch
    - tooling/git-main-branch-*.ts
    - package.json
    - bun.lock
tasks:
  typescript-test:
    command: bun --config=/dev/null --no-env-file test --timeout 15000 --path-ignore-patterns "tooling/{deployment-*,deploy-*,assemble-agent-instructions*,install-agent-skills*,install-hunspell-dictionary*,design-claim-audit*,code-search-*,colgrep-search*}.ts"
    deps:
      - agent-memory:build
      - fish-setup
      - rust
    inputs:
      - "@group(generalTypeScriptTests)"
      - "@group(typescriptToolchain)"
      - .github/workflows/test-typescript.yml
    options:
      cache: false
  fish-test:
    script: |
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -euo pipefail
      fish --no-config home/.config/fish/tests/git_cleanup_test.fish
      fish --no-config home/.config/fish/tests/git_main_branch_test.fish
      fish --no-config home/.config/fish/tests/path_test.fish
      fish --no-config home/.config/fish/tests/runtime_state_test.fish
    deps:
      - fish-setup
      - dependencies
    inputs:
      - "@group(fishGate)"
      - "@group(fishBehaviorDependencies)"
    tags:
      - fish
    toolchains: bun
  node-runtime-check:
    command: bun --config=/dev/null --no-env-file tooling/node-version-contract.ts verify-runtime
    inputs:
      - package.json
      - tooling/node-version-contract.ts
    options:
      cache: false
