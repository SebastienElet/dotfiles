inheritedBy:
  tags:
    - repository
tasks:
  gitleaks-setup:
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      case "$(uname -s)" in
        Darwin) brew install gitleaks ;;
        Linux)
          gitleaks_version=8.30.1
          mkdir -p .moon/cache/gitleaks
          curl --fail --location --connect-timeout 10 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$gitleaks_version/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            --output .moon/cache/gitleaks/archive.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .moon/cache/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf .moon/cache/gitleaks/archive.tar.gz -C .moon/cache/gitleaks gitleaks
          chmod u+x .moon/cache/gitleaks/gitleaks
          ;;
        *) exit 1 ;;
      esac
    deps:
      - homebrew
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          test "$(uname -s)" = Darwin && brew list --formula --versions gitleaks
    options:
      cache: false
      mutex: homebrew
  secret-prepare:
    script: |-
      set -e
      test -z "$(git config --get core.hooksPath)"
      destination=$(git rev-parse --git-path hooks/pre-commit)
      test ! -L "$destination"
      test ! -e "$destination" || cmp -s tooling/pre-commit "$destination"
      mkdir -p "$(dirname "$destination")"
      install -m 755 tooling/pre-commit "$destination"
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: always
  secret-scan:
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
      gitleaks git --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null \
        --log-opts="--all --full-history -m --text --no-textconv --no-ext-diff --no-renames"
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: always
  secret-test:
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file test --timeout 30000 tooling/gitleaks.test.ts
    deps:
      - gitleaks-setup
      - dependencies
    toolchains: bun
    options:
      cache: false
      runInCI: always
