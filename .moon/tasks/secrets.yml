inheritedBy:
  tags:
    - repository
tasks:
  gitleaks-setup:
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
      set -e
      case "$(uname -s)" in
        Darwin) brew install gitleaks ;;
        Linux) bun --config=/dev/null --no-env-file tooling/install-gitleaks.ts ;;
        *) exit 1 ;;
      esac
    deps:
      - homebrew
      - dependencies
    checks:
      - check: condition
        script: |-
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          case "$(uname -s)" in
            Darwin) brew list --formula --versions gitleaks ;;
            Linux) bun --config=/dev/null --no-env-file tooling/install-gitleaks.ts --check ;;
            *) exit 1 ;;
          esac
    toolchains: bun
    options:
      cache: false
      mutex: homebrew
  secret-prepare:
    description: Prepare Gitleaks and the repository pre-commit hook
    command: bun --config=/dev/null --no-env-file tooling/secret-hook.ts
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: false
  secret-staged:
    description: Scan indexed paths and the staged diff without installation
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file tooling/secret-scan.ts staged
    options:
      cache: false
      runInCI: false
  secret-current:
    description: Scan private paths and all tracked content at HEAD
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file tooling/secret-scan.ts current
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: always
  secret-ci:
    description: Scan tracked HEAD and every introduced commit
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file tooling/secret-scan.ts ci
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: always
  secret-history:
    description: Rescan every commit accessible from local refs
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file tooling/secret-scan.ts history
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: false
  secret-test:
    description: Exercise real Gitleaks, commits, hook installation and CI failures offline
    script: |-
      export PATH="$workspaceRoot/.moon/cache/gitleaks:$PATH:/opt/homebrew/bin:/usr/local/bin"
      bun --config=/dev/null --no-env-file test --timeout 30000 tooling/secret-scan.test.ts tooling/secret-scan-adversarial.test.ts tooling/secret-scan-allowlists.test.ts tooling/secret-hook.test.ts tooling/secret-ci.test.ts tooling/install-gitleaks.test.ts
    deps:
      - gitleaks-setup
    options:
      cache: false
      runInCI: always
