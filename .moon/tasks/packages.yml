    env:
      HOMEBREW_NO_ASK: "1"
    toolchains: system
    options:
      cache: false
      mutex: homebrew
      runInCI: true
  actionlint-setup:
    script: |-
      export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/go/bin"
      set -e
      case "$(uname -s)" in
        Darwin) brew install actionlint ;;
        Linux) go version; go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 ;;
        *) exit 1 ;;
      esac
    deps:
      - homebrew
    checks:
      - check: condition
        script: |-
