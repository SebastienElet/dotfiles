inheritedBy:
  tags:
    - harness
taskOptions:
  cache: false
  runInCI: false
  runFromWorkspaceRoot: true
tasks:
  claude:
    command: noop
    deps:
      - home:hunspell-dictionaries
      - claude-binary
      - claude-codex-companion
      - claude-instructions
      - claude-rules
      - claude-skills
      - claude-hooks
    toolchains: system
  claude-binary:
    script: |-
      set -euo pipefail
      curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 https://claude.ai/install.sh | bash -s latest
      test -x "$HOME/.local/bin/claude"
    checks:
      - check: condition
        script: test -x "$HOME/.local/bin/claude"
    toolchains: system
    options:
      os: macos
  claude-codex-companion:
    description: Install the official Codex companion for Claude development review
    command: bun --config=/dev/null --no-env-file tooling/install-claude-codex.ts
    deps:
      - repository:dependencies
      - claude-binary
      - codex-binary
    toolchains: system
    options:
      os: macos
      mutex: harness-mutation
  claude-instructions:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/harness/AGENTS.md" "$HOME/.claude/CLAUDE.md"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/harness/SOUL.md" "$HOME/.claude/SOUL.md"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/harness/USER.md" "$HOME/.claude/USER.md"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/harness/visual-presentation.md" "$HOME/.claude/visual-presentation.md"
    deps:
      - repository:dependencies
    toolchains: bun
  claude-rules:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/@sebastienelet/agent-skills/skills/agent-instructions/references/maintenance.md" "$HOME/.claude/rules/agent-instructions.md"
    deps:
      - repository:dependencies
    toolchains: bun
  claude-skills:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/install-agent-skills.ts" "$workspaceRoot" "$HOME" claude
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/@sebastienelet/proof-integrity-review/skills/proof-integrity-review" "$HOME/.claude/skills/proof-integrity-review"
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/deploy-link.ts" "$workspaceRoot/node_modules/@sebastienelet/agent-handoff/skills/handoff" "$HOME/.claude/skills/handoff"
    deps:
      - repository:dependencies
    toolchains: bun
  claude-hooks:
    script: |-
      set -e
      bun --config=/dev/null --no-env-file "$workspaceRoot/tooling/install-agent-hooks.ts" "$workspaceRoot" "$HOME" claude
      ARNES_SOURCE_ROOT="$workspaceRoot" ARNES_REPOSITORY_ROOT="$workspaceRoot" "$HOME/.local/bin/arnes" doctor hooks --agent claude --color never > /dev/null
    deps:
      - repository:dependencies
      - arnes:install
      - agent-handoff
      - agent-measure
      - output-discipline-hook
    toolchains: system
    options:
      mutex: harness-mutation
