name: Bitbucket Linear tests
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  MOON_HEAD: ${{ github.sha }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ fromJSON(steps.query.outputs.result).tasks['bitbucket-linear-sync'] != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: >-
          moon action-graph --json bitbucket-linear-sync:fmt bitbucket-linear-sync:clippy bitbucket-linear-sync:check bitbucket-linear-sync:test bitbucket-linear-sync:doc > /dev/null
      - id: query
        run: |
          {
            printf 'result<<MOON_QUERY_RESULT\n'
            moon query tasks --affected remote --upstream none --downstream none \
              --project '^bitbucket-linear-sync$' --id '^(fmt|clippy|check|test|doc)$'
            printf 'MOON_QUERY_RESULT\n'
          } >> "$GITHUB_OUTPUT"
  bitbucket-linear:
    needs: select
    if: needs.select.outputs.affected == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: >-
          moon ci --downstream none bitbucket-linear-sync:fmt bitbucket-linear-sync:clippy
          bitbucket-linear-sync:check bitbucket-linear-sync:test bitbucket-linear-sync:doc
