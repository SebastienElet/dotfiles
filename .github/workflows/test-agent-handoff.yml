name: Agent Handoff tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  agent-handoff:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: >-
          moon ci --downstream none agent-handoff:fmt agent-handoff:clippy agent-handoff:check agent-handoff:test agent-handoff:doc agent-handoff:deployment-test
