name: Agent Handoff tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  MOON_HEAD: ${{ github.sha }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ fromJSON(steps.query.outputs.result).tasks['agent-handoff'] != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - id: query
        run: |
          {
            printf 'result<<MOON_QUERY_RESULT\n'
            moon query tasks --affected remote --upstream none --downstream none \
              --project '^agent-handoff$' --id '^(fmt|clippy|check|test|doc|deployment-test)$'
            printf 'MOON_QUERY_RESULT\n'
          } >> "$GITHUB_OUTPUT"
  agent-handoff:
    needs: select
    if: needs.select.outputs.affected == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: >-
          moon ci --downstream none agent-handoff:fmt agent-handoff:clippy agent-handoff:check agent-handoff:test agent-handoff:doc agent-handoff:deployment-test
