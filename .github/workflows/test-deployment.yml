name: Deployment tests

on:
  push:
    paths:
      - home/**
      - harness/**
      - tooling/makefile-test
      - tooling/fish-deployment-test
      - tooling/install-hunspell-dictionary*
      - tooling/pr-feedback-command-test
      - tooling/xdg-config-test
      - Makefile
      - .github/workflows/test-deployment.yml
  pull_request:
    paths:
      - home/**
      - harness/**
      - tooling/makefile-test
      - tooling/fish-deployment-test
      - tooling/install-hunspell-dictionary*
      - tooling/pr-feedback-command-test
      - tooling/xdg-config-test
      - Makefile
      - .github/workflows/test-deployment.yml

jobs:
  deployment:
    name: Deployment (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: tooling/makefile-test
      - run: tooling/fish-deployment-test
      - run: bun test tooling/install-hunspell-dictionary.test.ts tooling/install-hunspell-dictionary-failures.test.ts
      - run: tooling/pr-feedback-command-test
      - run: tooling/xdg-config-test
