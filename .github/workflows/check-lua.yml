name: Lua lint
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROTO_DETECT_STRATEGY: only-prototools
  MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  MOON_HEAD: ${{ github.sha }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      neovim: ${{ fromJSON(steps.query.outputs.result).tasks.repository['neovim-lint'] != null }}
      wezterm: ${{ fromJSON(steps.query.outputs.result).tasks.repository['wezterm-lint'] != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - run: moon action-graph --json repository:neovim-lint repository:wezterm-lint > /dev/null
      - id: query
        run: |
          {
            printf 'result<<MOON_QUERY_RESULT\n'
            moon query tasks --affected remote --upstream none --downstream none \
              --project '^repository$' --id '^(neovim-lint|wezterm-lint)$'
            printf 'MOON_QUERY_RESULT\n'
          } >> "$GITHUB_OUTPUT"

  neovim:
    needs: select
    if: needs.select.outputs.neovim == 'true'
    name: neovim-lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - run: moon ci --downstream none repository:neovim-lint

  wezterm:
    needs: select
    if: needs.select.outputs.wezterm == 'true'
    name: wezterm-lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - run: moon ci --downstream none repository:wezterm-lint

  required:
    name: Lua required
    needs: [select, neovim, wezterm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$PASSED" = true
        env:
          PASSED: >-
            ${{ needs.select.result == 'success' &&
            ((needs.select.outputs.neovim == 'true' && needs.neovim.result == 'success') ||
            (needs.select.outputs.neovim == 'false' && needs.neovim.result == 'skipped')) &&
            ((needs.select.outputs.wezterm == 'true' && needs.wezterm.result == 'success') ||
            (needs.select.outputs.wezterm == 'false' && needs.wezterm.result == 'skipped')) }}
