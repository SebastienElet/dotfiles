name: TypeScript
on:
  - push
  - pull_request
jobs:
  test:
    name: Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - uses: volta-cli/action@v4
      - run: moon run repository:node-runtime-check repository:typescript-test
        env:
          SCRAPLING_DOCKER_SMOKE: "1"
