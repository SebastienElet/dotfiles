name: Proof Integrity tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  proof-integrity:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: >-
          moon ci --downstream none proof-integrity:fmt proof-integrity:clippy proof-integrity:check proof-integrity:test proof-integrity:doc
