name: TypeScript static gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static:
    name: TypeScript static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
        with:
          moon-version: 2.5.3
      - run: >-
          moon ci typescript:lint typescript:typecheck
          typescript:format-check
