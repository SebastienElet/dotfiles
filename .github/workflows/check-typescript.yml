name: TypeScript static gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static:
    name: TypeScript static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
        with:
          moon-version: 2.5.3
      - id: affected
        run: |
          moon query affected > "$RUNNER_TEMP/moon-affected.json"
          any="$(jq -r '
            [(.tasks // {} | keys[]), (.projects // {} | .[] | (.tasks // [])[])]
            | any(. == "typescript:lint" or . == "typescript:typecheck" or . == "typescript:format-check")
          ' "$RUNNER_TEMP/moon-affected.json")"
          echo "any=$any" >> "$GITHUB_OUTPUT"
      - if: steps.affected.outputs.any == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.affected.outputs.any == 'true'
        run: bun --config=/dev/null --no-env-file install --frozen-lockfile --ignore-scripts
      - if: steps.affected.outputs.any == 'true'
        run: bun --config=/dev/null --no-env-file test tooling/moon-typescript-gates.test.ts
        env:
          MOON_TYPESCRIPT_CONTRACT: "1"
      - if: steps.affected.outputs.any == 'true'
        run: >-
          moon ci --no-actions typescript:lint typescript:typecheck
          typescript:format-check
