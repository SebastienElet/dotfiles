name: Agent Memory tests

on:
  push:
    paths:
      - .cargo/**
      - tooling/agent-memory/**
      - tooling/agent-memory-eval*.ts
      - tooling/agent-memory-eval-scenarios.json
      - tooling/deployment-agent-memory.test.ts
      - tooling/arnes/**
      - harness/rules/memory-governance-cursor.mdc
      - harness/skills/memory-governance/**
      - home/.arnes.yaml
      - Makefile
      - .github/workflows/test-agent-memory.yml
  pull_request:
    paths:
      - .cargo/**
      - tooling/agent-memory/**
      - tooling/agent-memory-eval*.ts
      - tooling/agent-memory-eval-scenarios.json
      - tooling/deployment-agent-memory.test.ts
      - tooling/arnes/**
      - harness/rules/memory-governance-cursor.mdc
      - harness/skills/memory-governance/**
      - home/.arnes.yaml
      - Makefile
      - .github/workflows/test-agent-memory.yml

jobs:
  agent-memory:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Funsafe-code
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --manifest-path tooling/agent-memory/Cargo.toml --check
      - run: cargo clippy --manifest-path tooling/agent-memory/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tooling/agent-memory/Cargo.toml
