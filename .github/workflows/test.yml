name: Smoke tests
on: [push]
jobs:
  build:
    runs-on: macOS-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Execute full install
      run: |
        make all SKIP_PAID_APPS=1
        make -q qovery-cli
    - name: Check Claude hook registration
      run: scripts/setup/claude_handoff_hook_test
