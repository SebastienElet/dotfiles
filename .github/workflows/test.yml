name: Smoke tests
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  minimal:
    name: Minimal macOS profile
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: moon run tooling:moon-bootstrap-smoke
      - name: Bootstrap the repository Moon pin
        run: ./tooling/install-moon
      - name: Install, clean and reinstall the minimal profile
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon run tooling:smoke-minimal
      - run: moon run tooling:upgrade-neovim-test
