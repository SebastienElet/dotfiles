name: Smoke tests
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  MOON_HEAD: ${{ github.sha }}

jobs:
  minimal:
    name: Minimal macOS profile
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: moon run tooling:moon-bootstrap-smoke
      - name: Install and replay the minimal profile
        run: moon run tooling:smoke-minimal
      - run: moon action-graph --json tooling:upgrade-neovim-test > /dev/null
      - id: query
        run: |
          {
            printf 'result<<MOON_QUERY_RESULT\n'
            moon query tasks --affected remote --upstream none --downstream none \
              --project '^tooling$' --id '^upgrade-neovim-test$'
            printf 'MOON_QUERY_RESULT\n'
          } >> "$GITHUB_OUTPUT"
      - if: fromJSON(steps.query.outputs.result).tasks.tooling['upgrade-neovim-test'] != null
        run: moon run tooling:upgrade-neovim-test

  required:
    name: Smoke required
    needs: minimal
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$PASSED" = true
        env:
          PASSED: ${{ needs.minimal.result == 'success' }}
