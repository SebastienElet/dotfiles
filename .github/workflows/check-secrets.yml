name: Secret scanning
on:
  push:
    branches:
      - main
  pull_request: null
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - name: Prepare the pinned scanner and Bun dependencies
        run: moon run repository:gitleaks-setup
      - name: Prove refusal using fictitious credentials in disposable repositories
        run: |
          moon_binary=$(command -v moon)
          runner_user=$(id -un)
          sudo unshare --net -- sudo -u "$runner_user" env "PATH=$PATH" \
            "$moon_binary" run repository:secret-test --upstream none --no-actions
      - name: Scan the tested tree and introduced commits without affected selection
        run: moon run repository:secret-ci
