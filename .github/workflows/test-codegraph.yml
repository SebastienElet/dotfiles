name: CodeGraph tests

on:
  push:
    paths:
      - .agents/skills/codegraph/**
      - .config/git/ignore
      - codegraph/**
      - scripts/codegraph_*
      - Makefile
      - .github/workflows/test-codegraph.yml
  pull_request:
    paths:
      - .agents/skills/codegraph/**
      - .config/git/ignore
      - codegraph/**
      - scripts/codegraph_*
      - Makefile
      - .github/workflows/test-codegraph.yml

jobs:
  codegraph:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: make jq tokei ripgrep codegraph-cli "$HOME/.local/bin/claude" "$HOME/.volta/bin/codex"
      - run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.volta/bin" >> "$GITHUB_PATH"
      - run: |
          claude --version
          codex --version
          codegraph --version
      - run: bash .agents/skills/codegraph/scripts/measure_repository_test.sh
      - run: bash scripts/codegraph_configure_test
      - run: bash scripts/codegraph_mcp_test
      - run: bash scripts/codegraph_network_test
