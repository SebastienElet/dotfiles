name: CodeGraph tests

on:
  push:
    paths:
      - harness/skills/codegraph/**
      - .config/git/ignore
      - tooling/codegraph/**
      - tooling/codegraph-*
      - tooling/colgrep-worktree*
      - Brewfile
      - package.json
      - bun.lock
      - tsconfig.json
      - Makefile
      - .github/workflows/test-codegraph.yml
  pull_request:
    paths:
      - harness/skills/codegraph/**
      - .config/git/ignore
      - tooling/codegraph/**
      - tooling/codegraph-*
      - tooling/colgrep-worktree*
      - Brewfile
      - package.json
      - bun.lock
      - tsconfig.json
      - Makefile
      - .github/workflows/test-codegraph.yml

jobs:
  measurement-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cargo install tokei --version 14.0.0 --locked
      - run: bun test tooling/codegraph-repository-*.test.ts

  codegraph:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make bundle-minimal codegraph-cli "$HOME/.local/bin/colgrep-worktree" "$HOME/.local/bin/claude" "$HOME/.volta/bin/codex"
      - run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.volta/bin" >> "$GITHUB_PATH"
      - run: |
          claude --version
          codex --version
          codegraph --version
          colgrep --version
      - run: bun test tooling/deployment-links.test.ts tooling/colgrep-worktree*.test.ts
      - run: COLGREP_INTEGRATION=1 bun test tooling/colgrep-worktree-integration.test.ts
      - run: bun test tooling/codegraph-repository-*.test.ts
      - run: CODEGRAPH_REAL_CLAUDE_BIN="$HOME/.local/bin/claude" CODEGRAPH_REAL_CODEX_BIN="$HOME/.volta/bin/codex" bun test tooling/codegraph-configure.test.ts tooling/codegraph-configure-deployment.test.ts
      - run: CODEGRAPH_INTEGRATION=1 bun test tooling/codegraph-integration.test.ts
      - run: bun run typecheck
