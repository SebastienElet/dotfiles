name: Lint
on: [push, pull_request]

jobs:
  fish:
    name: Fish shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Fish
        run: brew install fish

      - name: Check Fish syntax
        run: |
          echo "Checking Fish syntax..."
          git ls-files 'fish/*.fish' 'fish/**/*.fish' | xargs -I{} fish --no-execute {}
          echo "✅ Fish syntax OK"

      - name: Check Fish formatting
        run: |
          echo "Checking Fish formatting..."
          ERRORS=0
          for file in $(git ls-files 'fish/*.fish' 'fish/**/*.fish'); do
            if ! fish_indent --check "$file" 2>/dev/null; then
              echo "❌ $file needs formatting"
              fish_indent "$file" | diff -u "$file" - || true
              ERRORS=1
            fi
          done
          if [ "$ERRORS" -eq 1 ]; then
            echo ""
            echo "Run 'fish_indent -w <file>' to fix formatting"
            exit 1
          fi
          echo "✅ Fish formatting OK"

  lua:
    name: Lua (NeoVim)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install luacheck
        run: brew install luacheck

      - name: Lint Lua files
        run: |
          echo "Checking Lua syntax..."
          luacheck nvim/lua --no-unused-args --no-max-line-length --globals vim
          echo "✅ Lua syntax OK"

  shellcheck:
    name: Shell scripts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail

          command -v shellcheck > /dev/null \
            || { echo "::error::shellcheck is missing: the gate cannot run"; exit 1; }

          # Scripts with a bash/sh shebang, plus every .sh file.
          scripts=$(
            {
              git grep -lI -E '^#!.*(bash|sh)' -- scripts install.sh
              git ls-files '*.sh'
            } | sort -u
          )

          # This probe decides what gets checked, so a broken probe must fail the
          # job instead of emptying the list. One canary per probe: install.sh for
          # the extension list, scripts/upgrade for the shebang scan, which has no
          # .sh extension. A pattern that matches nothing — git grep -E does not
          # support \b, for instance — would otherwise report green having read
          # nothing.
          for canary in install.sh scripts/upgrade; do
            printf '%s\n' "$scripts" | grep -qx "$canary" \
              || { echo "::error::script discovery is broken: $canary missing from the list"; exit 1; }
          done

          printf '%s\n' "$scripts"
          printf '%s\n' "$scripts" | xargs -I{} shellcheck --severity=error {}
          echo "✅ Shell scripts OK"
