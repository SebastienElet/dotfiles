name: Lint
on: [push, pull_request]

jobs:
  fish:
    name: Fish shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Fish
        run: brew install fish

      - name: Check Fish syntax
        run: |
          echo "Checking Fish syntax..."
          git ls-files 'fish/*.fish' 'fish/**/*.fish' | xargs -I{} fish --no-execute {}
          echo "✅ Fish syntax OK"

      - name: Check Fish formatting
        run: |
          echo "Checking Fish formatting..."
          ERRORS=0
          for file in $(git ls-files 'fish/*.fish' 'fish/**/*.fish'); do
            if ! fish_indent --check "$file" 2>/dev/null; then
              echo "❌ $file needs formatting"
              fish_indent "$file" | diff -u "$file" - || true
              ERRORS=1
            fi
          done
          if [ "$ERRORS" -eq 1 ]; then
            echo ""
            echo "Run 'fish_indent -w <file>' to fix formatting"
            exit 1
          fi
          echo "✅ Fish formatting OK"

  lua:
    name: Lua (NeoVim)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install luacheck
        run: brew install luacheck

      - name: Lint Lua files
        run: |
          echo "Checking Lua syntax..."
          luacheck nvim/lua --no-unused-args --no-max-line-length --globals vim
          echo "✅ Lua syntax OK"

  shellcheck:
    name: Shell scripts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail

          command -v shellcheck > /dev/null \
            || { echo "::error::shellcheck is missing: the gate cannot run"; exit 1; }

          found_by_shebang=$(git grep -lI -E '^#!.*(bash|sh)' -- scripts install.sh)
          found_by_extension=$(git ls-files '*.sh')
          scripts=$(printf '%s\n%s\n' "$found_by_shebang" "$found_by_extension" | sort -u)

          canary_of_shebang_scan=scripts/upgrade
          canary_of_extension_scan=install.sh
          for canary in "$canary_of_shebang_scan" "$canary_of_extension_scan"; do
            printf '%s\n' "$scripts" | grep -qx "$canary" \
              || { echo "::error::script discovery is broken: $canary missing from the list"; exit 1; }
          done

          printf '%s\n' "$scripts"
          printf '%s\n' "$scripts" | xargs -I{} shellcheck --severity=error {}
          echo "✅ Shell scripts OK"

  selfchecks:
    name: Script self-checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: brew install jq

      - name: Run script self-checks
        run: |
          set -euo pipefail

          command -v jq > /dev/null \
            || { echo "::error::jq is missing: the self-checks cannot run"; exit 1; }

          tests=$(git ls-files 'scripts/*_test')

          for canary in scripts/claude_handoff_check_test; do
            printf '%s\n' "$tests" | grep -qx "$canary" \
              || { echo "::error::self-check discovery is broken: $canary missing from the list"; exit 1; }
          done

          printf '%s\n' "$tests"
          printf '%s\n' "$tests" | while IFS= read -r test; do
            echo "--- $test"
            "./$test"
          done
          echo "✅ Script self-checks OK"
