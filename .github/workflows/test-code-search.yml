name: Code search tests

on:
  push:
    paths:
      - harness/skills/code-search/**
      - tooling/code-search-*
      - tooling/colgrep-search*
      - Brewfile
      - package.json
      - bun.lock
      - tsconfig.json
      - Makefile
      - .github/workflows/test-code-search.yml
  pull_request:
    paths:
      - harness/skills/code-search/**
      - tooling/code-search-*
      - tooling/colgrep-search*
      - Brewfile
      - package.json
      - bun.lock
      - tsconfig.json
      - Makefile
      - .github/workflows/test-code-search.yml

jobs:
  code-search:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make bundle-minimal "$HOME/.local/bin/colgrep-search"
      - run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: |
          colgrep --version
          colgrep-search --help || test "$?" -eq 1
      - run: bun test tooling/deployment-links.test.ts tooling/code-search-*.test.ts tooling/colgrep-search*.test.ts
      - run: COLGREP_INTEGRATION=1 bun test tooling/colgrep-search-integration.test.ts
      - run: bun run typecheck
