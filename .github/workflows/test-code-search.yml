name: Code search tests
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  code-search:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
      - run: moon ci --concurrency 1 --downstream none tooling:code-search-test tooling:code-search-integration-test
