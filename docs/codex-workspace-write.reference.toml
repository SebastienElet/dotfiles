sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false
writable_roots = [
  "~/Code",
  "~/.dotfiles",
  "~/.dotfiles/.git",
  "~/.herdr",
  "~/.bun",
  "~/.npm",
  "~/.turbo",
  "~/.cache",
  "~/Library/Caches",
  "~/Library/pnpm",
  "~/.docker",
  "~/.orbstack",
  "~/.codex",
  "~/.local",
  "/tmp",
]
